<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">
  <rect width="1200" height="640" rx="20" fill="#f2f6fa"/>
  <defs>
    <marker id="sfb1" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#3a6491"/></marker>
  </defs>

  <text x="600" y="44" text-anchor="middle" font-size="21" font-weight="700" fill="#24476b">静默降级把 46 次失败变成 46 个坏沙箱</text>
  <text x="600" y="72" text-anchor="middle" font-size="14" fill="#6b87a3">读不到就继续建，不是宽容——是把一次能当场说清的失败，换成一个以后说不清的沙箱</text>

  <!-- 左：当没事发生（现状） -->
  <rect x="50" y="96" width="570" height="312" rx="14" fill="#ffffff" stroke="#b5544a" stroke-width="2"/>
  <text x="76" y="122" font-size="15" font-weight="700" fill="#b5544a">当没事发生（现状）</text>

  <rect x="74" y="132" width="280" height="34" rx="9" fill="#ffffff" stroke="#d8c2bf" stroke-width="1.6"/>
  <text x="92" y="154" font-size="12" font-weight="700" fill="#b5544a">1</text>
  <text x="110" y="154" font-size="13" fill="#24476b">调用方没给启动命令</text>

  <path d="M207,172 L214,182 L221,172" fill="none" stroke="#b5544a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="74" y="190" width="280" height="34" rx="9" fill="#ffffff" stroke="#d8c2bf" stroke-width="1.6"/>
  <text x="92" y="212" font-size="12" font-weight="700" fill="#b5544a">2</text>
  <text x="110" y="212" font-size="13" fill="#24476b">服务去读镜像自带的</text>

  <path d="M207,230 L214,240 L221,230" fill="none" stroke="#b5544a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="74" y="248" width="280" height="34" rx="9" fill="#b5544a"/>
  <text x="92" y="270" font-size="12" font-weight="700" fill="#f0d9d6">3</text>
  <text x="110" y="270" font-size="13" fill="#ffffff">读不到 → <tspan font-weight="700">继续建</tspan></text>

  <path d="M207,288 L214,298 L221,288" fill="none" stroke="#b5544a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="74" y="306" width="280" height="34" rx="9" fill="#8c4a42"/>
  <text x="92" y="328" font-size="12" font-weight="700" fill="#f0d9d6">4</text>
  <text x="110" y="328" font-size="13" fill="#ffffff">沙箱建出来了，但用不了</text>

  <text x="488" y="192" text-anchor="middle" font-size="11.5" fill="#6b87a3">结果</text>
  <text x="488" y="228" text-anchor="middle" font-size="40" font-weight="700" fill="#b5544a">46 个</text>
  <text x="488" y="258" text-anchor="middle" font-size="11.5" fill="#8c4a42">
    <tspan x="488">46 次本该失败的创建</tspan>
    <tspan x="488" dy="19">变成 46 个建出来但用不了的沙箱</tspan>
  </text>

  <rect x="74" y="352" width="522" height="48" rx="9" fill="#f6ebe9" stroke="#d8c2bf" stroke-width="1.4"/>
  <text x="335" y="373" text-anchor="middle" font-size="12" fill="#8c4a42">
    <tspan x="335">失败被推迟到调用方真正执行命令时才暴露——</tspan>
    <tspan x="335" dy="19">那时已隔了很久，现场也没了，根本查不出是创建阶段的问题</tspan>
  </text>

  <!-- 右：当场失败（改后） -->
  <rect x="644" y="96" width="506" height="312" rx="14" fill="#ffffff" stroke="#24476b" stroke-width="2.5"/>
  <text x="670" y="122" font-size="15" font-weight="700" fill="#24476b">当场失败（改后）</text>

  <rect x="668" y="132" width="458" height="92" rx="9" fill="#eef5fa" stroke="#c3d6e6" stroke-width="1.4" stroke-dasharray="6 5"/>
  <text x="897" y="170" text-anchor="middle" font-size="12.5" fill="#6b87a3">
    <tspan x="897">第 1、2 步完全一样</tspan>
    <tspan x="897" dy="20">调用方没给启动命令，服务去读镜像自带的</tspan>
  </text>

  <path d="M890,230 L897,240 L904,230" fill="none" stroke="#3a6491" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="668" y="248" width="458" height="34" rx="9" fill="#24476b"/>
  <text x="690" y="270" font-size="12" font-weight="700" fill="#a9c4dc">3′</text>
  <text x="712" y="270" font-size="13" fill="#ffffff">读不到 → <tspan font-weight="700">报错</tspan>，创建终止</text>

  <path d="M890,288 L897,298 L904,288" fill="none" stroke="#3a6491" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="668" y="306" width="458" height="34" rx="9" fill="#5b88b0"/>
  <text x="690" y="328" font-size="12" font-weight="700" fill="#dce9ff">4′</text>
  <text x="712" y="328" font-size="13" fill="#ffffff">调用方立刻知道，带着现场</text>

  <rect x="668" y="352" width="458" height="48" rx="9" fill="#eef5fa" stroke="#c3d6e6" stroke-width="1.4"/>
  <text x="897" y="373" text-anchor="middle" font-size="12" fill="#24476b">
    <tspan x="897">同样 46 次，当场就是 46 次创建失败</tspan>
    <tspan x="897" dy="19">问题停在它发生的地方，不会攒成 46 个坏沙箱</tspan>
  </text>

  <!-- 下：分阶段状态 -->
  <rect x="50" y="422" width="1100" height="126" rx="14" fill="#ffffff" stroke="#c3d6e6" stroke-width="1.6"/>
  <text x="76" y="446" font-size="15" font-weight="700" fill="#24476b">配套的分阶段状态：把「建好了」拆成看得见的四步</text>

  <rect x="115" y="460" width="190" height="44" rx="10" fill="#ffffff" stroke="#5b88b0" stroke-width="1.6"/>
  <text x="210" y="488" text-anchor="middle" font-size="13.5" fill="#24476b">排队</text>

  <path d="M311,482 L369,482" stroke="#3a6491" stroke-width="2" marker-end="url(#sfb1)"/>

  <rect x="375" y="460" width="190" height="44" rx="10" fill="#ffffff" stroke="#5b88b0" stroke-width="1.6"/>
  <text x="470" y="488" text-anchor="middle" font-size="13.5" fill="#24476b">调度</text>

  <path d="M571,482 L629,482" stroke="#3a6491" stroke-width="2" marker-end="url(#sfb1)"/>

  <rect x="635" y="460" width="190" height="44" rx="10" fill="#ffffff" stroke="#5b88b0" stroke-width="1.6"/>
  <text x="730" y="488" text-anchor="middle" font-size="13.5" fill="#24476b">拉镜像</text>

  <path d="M831,482 L889,482" stroke="#3a6491" stroke-width="2" marker-end="url(#sfb1)"/>

  <rect x="895" y="460" width="190" height="44" rx="10" fill="#24476b"/>
  <text x="990" y="481" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">就绪</text>
  <text x="990" y="498" text-anchor="middle" font-size="11.5" fill="#a9c4dc">能跑命令才报就绪</text>

  <text x="386" y="528" font-size="12.5" fill="#6b87a3">失败时错误必须写明</text>
  <rect x="511" y="512" width="86" height="24" rx="12" fill="#eef5fa" stroke="#c3d6e6" stroke-width="1.2"/>
  <text x="554" y="528" text-anchor="middle" font-size="11.5" fill="#24476b">在哪个阶段</text>
  <rect x="607" y="512" width="86" height="24" rx="12" fill="#eef5fa" stroke="#c3d6e6" stroke-width="1.2"/>
  <text x="650" y="528" text-anchor="middle" font-size="11.5" fill="#24476b">能不能重试</text>
  <rect x="703" y="512" width="110" height="24" rx="12" fill="#eef5fa" stroke="#c3d6e6" stroke-width="1.2"/>
  <text x="758" y="528" text-anchor="middle" font-size="11.5" fill="#24476b">命令有没有执行</text>

  <!-- 结论 -->
  <rect x="50" y="562" width="1100" height="58" rx="12" fill="#24476b"/>
  <text x="600" y="585" text-anchor="middle" font-size="15.5" font-weight="700" fill="#ffffff">读不到就当没事发生，错误会往后传，而且传到看不见的地方</text>
  <text x="600" y="606" text-anchor="middle" font-size="12.5" fill="#a9c4dc">当场报错不会多出一次失败，只是让这次失败留在它真正发生的那一步</text>
</svg>
