<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">
  <rect width="1200" height="600" rx="20" fill="#f2f6fa"/>

  <text x="600" y="44" text-anchor="middle" font-size="21" font-weight="700" fill="#24476b">同一个控制面，两组基准差一个数量级</text>
  <text x="600" y="72" text-anchor="middle" font-size="14" fill="#6b87a3">差别不在被测对象，在分母里少了哪一段</text>

  <!-- 左：模拟节点 -->
  <rect x="50" y="104" width="540" height="260" rx="14" fill="#ffffff" stroke="#b5544a" stroke-width="2"/>
  <text x="320" y="132" text-anchor="middle" font-size="15.5" font-weight="700" fill="#b5544a">模拟节点组</text>
  <text x="320" y="154" text-anchor="middle" font-size="12" fill="#8c4a42">1000 个请求 · 50 台只登记不运行容器的节点 · 只算建 Pod</text>

  <text x="86" y="186" font-size="12.5" fill="#24476b">经引擎</text>
  <rect x="150" y="172" width="390" height="24" rx="5" fill="#b5544a"/>
  <text x="345" y="189" text-anchor="middle" font-size="11.5" fill="#ffffff">建 Pod　69.17 秒</text>

  <text x="86" y="222" font-size="12.5" fill="#24476b">直接建</text>
  <rect x="150" y="208" width="103" height="24" rx="5" fill="#5b88b0"/>
  <text x="201" y="225" text-anchor="middle" font-size="11.5" fill="#ffffff">18.24 秒</text>

  <text x="420" y="228" font-size="26" font-weight="700" fill="#b5544a">3.79 倍</text>

  <rect x="86" y="250" width="454" height="52" rx="8" fill="none" stroke="#b5544a" stroke-width="1.6" stroke-dasharray="7 5"/>
  <text x="313" y="272" text-anchor="middle" font-size="12.5" fill="#b5544a">镜像下载：不存在</text>
  <text x="313" y="292" text-anchor="middle" font-size="11.5" fill="#8c4a42">模拟节点不拉镜像、不起容器——这一段被剔除了</text>

  <text x="320" y="330" text-anchor="middle" font-size="12.5" fill="#8c4a42">分母里只剩控制面写请求，</text>
  <text x="320" y="350" text-anchor="middle" font-size="12.5" fill="#8c4a42">而那恰好是两条路径唯一不同的地方</text>

  <!-- 右：真实沙箱 -->
  <rect x="610" y="104" width="540" height="260" rx="14" fill="#ffffff" stroke="#24476b" stroke-width="2.5"/>
  <text x="880" y="132" text-anchor="middle" font-size="15.5" font-weight="700" fill="#24476b">真实沙箱组</text>
  <text x="880" y="154" text-anchor="middle" font-size="12" fill="#3a6491">60 个真实沙箱 · 调好 3 处配置后 · 端到端到可执行命令</text>

  <text x="646" y="186" font-size="12.5" fill="#24476b">经引擎</text>
  <rect x="710" y="172" width="150" height="24" rx="5" fill="#5b88b0"/>
  <rect x="860" y="172" width="240" height="24" rx="5" fill="#24476b"/>
  <text x="785" y="189" text-anchor="middle" font-size="11" fill="#ffffff">建 Pod</text>
  <text x="980" y="189" text-anchor="middle" font-size="11" fill="#ffffff">镜像下载 + 启动</text>

  <text x="646" y="222" font-size="12.5" fill="#24476b">直接建</text>
  <rect x="710" y="208" width="138" height="24" rx="5" fill="#5b88b0"/>
  <rect x="848" y="208" width="240" height="24" rx="5" fill="#24476b"/>

  <text x="880" y="266" text-anchor="middle" font-size="26" font-weight="700" fill="#24476b">差距 &lt; 5%</text>
  <text x="880" y="292" text-anchor="middle" font-size="12.5" fill="#3a6491">21.7 秒 vs 21.1 秒</text>

  <text x="880" y="330" text-anchor="middle" font-size="12.5" fill="#3a6491">镜像下载占了大头，</text>
  <text x="880" y="350" text-anchor="middle" font-size="12.5" fill="#3a6491">两条路径在这一段上完全一样</text>

  <!-- 结论 -->
  <rect x="50" y="386" width="1100" height="76" rx="12" fill="#24476b"/>
  <text x="600" y="414" text-anchor="middle" font-size="14.5" font-weight="700" fill="#ffffff">拿到一个性能倍数，先问分母里缺了什么，再问那段开销在真实负载里占多少</text>
  <text x="600" y="440" text-anchor="middle" font-size="12.5" fill="#a9c4dc">模拟节点测的是控制面上限，不是用户感知</text>

  <rect x="50" y="482" width="1100" height="86" rx="12" fill="#ffffff" stroke="#c3d6e6" stroke-width="1.5"/>
  <text x="600" y="508" text-anchor="middle" font-size="13.5" font-weight="700" fill="#3a6491">这个数字支撑的那个方案，最后被推翻了</text>
  <text x="600" y="532" text-anchor="middle" font-size="12.5" fill="#6b87a3">
    <tspan x="600">把建 Pod 搬进自己的服务要多写 1000 多行。三条支撑理由：一条只在上面左边那个前提下成立，</tspan>
    <tspan x="600" dy="19">另外两条压根没测。事前定好「慢不到 10% 就不改架构」，是唯一防止被漂亮数字说服的办法。</tspan>
  </text>
</svg>
