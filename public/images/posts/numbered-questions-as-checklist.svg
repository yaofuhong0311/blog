<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="580" viewBox="0 0 1200 580" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">
  <rect width="1200" height="580" rx="20" fill="#f2f6fa"/>
  <defs>
    <marker id="a5" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#3a6491"/>
    </marker>
  </defs>

  <text x="600" y="46" text-anchor="middle" font-size="21" font-weight="700" fill="#24476b">编号把一次回答拆成若干个必须单独交付的项</text>
  <text x="600" y="74" text-anchor="middle" font-size="14" fill="#6b87a3">段落式提问要靠记忆重建自己问了什么；编号只需对照一遍</text>

  <!-- 段落提问 -->
  <rect x="60" y="110" width="520" height="230" rx="14" fill="#ffffff" stroke="#b5544a" stroke-width="2"/>
  <text x="320" y="140" text-anchor="middle" font-size="15.5" font-weight="700" fill="#b5544a">写成一段话</text>

  <rect x="96" y="158" width="448" height="54" rx="10" fill="#f6ebe9"/>
  <text x="320" y="180" text-anchor="middle" font-size="12.5" fill="#8c4a42">
    <tspan x="320">「测试集群上是我的代码吗，适配器还要改吗，</tspan>
    <tspan x="320" dy="18">看完对比一下，另外看看能不能优化」</tspan>
  </text>

  <path d="M320,216 L320,244" stroke="#b5544a" stroke-width="2" marker-end="url(#a5)"/>
  <text x="320" y="262" text-anchor="middle" font-size="12.5" fill="#8c4a42">模型自己切分待答项 —— 这一步有损</text>

  <rect x="96" y="276" width="216" height="48" rx="8" fill="#ffffff" stroke="#d8c2bf" stroke-width="1.5"/>
  <text x="204" y="296" text-anchor="middle" font-size="12" fill="#8c4a42">好答的被展开</text>
  <text x="204" y="314" text-anchor="middle" font-size="11" fill="#b5544a">占满篇幅</text>

  <rect x="328" y="276" width="216" height="48" rx="8" fill="#b5544a"/>
  <text x="436" y="296" text-anchor="middle" font-size="12" fill="#ffffff">要查证的被带过</text>
  <text x="436" y="314" text-anchor="middle" font-size="11" fill="#f0d9d6">答案读起来仍然完整</text>

  <!-- 编号提问 -->
  <rect x="620" y="110" width="520" height="230" rx="14" fill="#ffffff" stroke="#24476b" stroke-width="2.5"/>
  <text x="880" y="140" text-anchor="middle" font-size="15.5" font-weight="700" fill="#24476b">写成编号</text>

  <rect x="656" y="158" width="448" height="76" rx="10" fill="#24476b"/>
  <text x="690" y="180" font-size="12" font-family="monospace" fill="#a9c4dc">几个问题：</text>
  <text x="690" y="198" font-size="12" font-family="monospace" fill="#ffffff">1. 测试集群上跑的是我的代码吗</text>
  <text x="690" y="214" font-size="12" font-family="monospace" fill="#ffffff">2. 这个适配器还有需要修改的地方吗</text>
  <text x="690" y="230" font-size="12" font-family="monospace" fill="#ffffff">3. 看完之后对比一下</text>

  <path d="M880,238 L880,262" stroke="#3a6491" stroke-width="2" marker-end="url(#a5)"/>
  <text x="880" y="280" text-anchor="middle" font-size="12.5" fill="#24476b">三条编号 = 三个必须分别落地的回应</text>

  <rect x="656" y="292" width="448" height="34" rx="8" fill="#eef5fa"/>
  <text x="880" y="314" text-anchor="middle" font-size="12.5" fill="#24476b">缺一条就是结构性缺失，核对一遍即可确认</text>

  <!-- 三道检查 -->
  <text x="600" y="382" text-anchor="middle" font-size="15" font-weight="700" fill="#3a6491">编号只是第一道检查，它之后还有两道</text>

  <rect x="80" y="400" width="320" height="110" rx="12" fill="#24476b"/>
  <text x="240" y="430" text-anchor="middle" font-size="14.5" font-weight="700" fill="#ffffff">编号</text>
  <text x="240" y="456" text-anchor="middle" font-size="12.5" fill="#a9c4dc">
    <tspan x="240">检查有没有回应</tspan>
    <tspan x="240" dy="19" fill="#ffffff">漏答就把原问题原样贴回去</tspan>
    <tspan x="240" dy="19">重新表述会给它重新解释的机会</tspan>
  </text>

  <rect x="440" y="400" width="320" height="110" rx="12" fill="#5b88b0"/>
  <text x="600" y="430" text-anchor="middle" font-size="14.5" font-weight="700" fill="#ffffff">追问依据</text>
  <text x="600" y="456" text-anchor="middle" font-size="12.5" fill="#eef5fa">
    <tspan x="600">检查回应是否成立</tspan>
    <tspan x="600" dy="19">一条编号项同样能被一句话带过</tspan>
    <tspan x="600" dy="19">而且占了位置反而不引起怀疑</tspan>
  </text>

  <rect x="800" y="400" width="320" height="110" rx="12" fill="#ffffff" stroke="#3a6491" stroke-width="2"/>
  <text x="960" y="430" text-anchor="middle" font-size="14.5" font-weight="700" fill="#3a6491">复述确认</text>
  <text x="960" y="456" text-anchor="middle" font-size="12.5" fill="#6b87a3">
    <tspan x="960">检查我有没有理解对</tspan>
    <tspan x="960" dy="19" fill="#24476b">问「明白了吗」不产生信息</tspan>
    <tspan x="960" dy="19">用自己的话重组才能验</tspan>
  </text>

  <text x="600" y="548" text-anchor="middle" font-size="13" fill="#6b87a3">写不出编号，通常意味着自己还没分清要问什么——这张检查表同时约束提问的一方</text>
</svg>
