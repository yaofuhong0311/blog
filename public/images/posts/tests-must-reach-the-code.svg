<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">
  <rect width="1200" height="600" rx="20" fill="#f2f6fa"/>
  <defs>
    <marker id="gtb" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#3a6491"/></marker>
    <marker id="gtr" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#b5544a"/></marker>
    <marker id="gtg" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#6b87a3"/></marker>
  </defs>

  <text x="600" y="44" text-anchor="middle" font-size="21" font-weight="700" fill="#24476b">全绿的那轮测试其实什么都没测到</text>
  <text x="600" y="72" text-anchor="middle" font-size="14" fill="#6b87a3">4 个样本全都绕开了被测代码，补两个真实镜像立刻出 2 个 bug</text>

  <!-- 左：首轮 -->
  <rect x="50" y="100" width="540" height="360" rx="14" fill="#ffffff" stroke="#5b88b0" stroke-width="2"/>
  <text x="76" y="128" font-size="15" font-weight="700" fill="#24476b">首轮：4 种镜像，全过</text>
  <text x="76" y="149" font-size="12" fill="#6b87a3">4 个样本，没有一条用例失败</text>

  <rect x="83" y="164" width="56" height="40" rx="8" fill="#eef5fa" stroke="#5b88b0" stroke-width="1.4"/>
  <text x="111" y="189" text-anchor="middle" font-size="11.5" fill="#24476b">镜像 1</text>
  <rect x="149" y="164" width="56" height="40" rx="8" fill="#eef5fa" stroke="#5b88b0" stroke-width="1.4"/>
  <text x="177" y="189" text-anchor="middle" font-size="11.5" fill="#24476b">镜像 2</text>
  <rect x="215" y="164" width="56" height="40" rx="8" fill="#eef5fa" stroke="#5b88b0" stroke-width="1.4"/>
  <text x="243" y="189" text-anchor="middle" font-size="11.5" fill="#24476b">镜像 3</text>
  <rect x="281" y="164" width="56" height="40" rx="8" fill="#eef5fa" stroke="#5b88b0" stroke-width="1.4"/>
  <text x="309" y="189" text-anchor="middle" font-size="11.5" fill="#24476b">镜像 4</text>

  <path d="M111,204 L111,216" stroke="#3a6491" stroke-width="1.6"/>
  <path d="M177,204 L177,216" stroke="#3a6491" stroke-width="1.6"/>
  <path d="M243,204 L243,216" stroke="#3a6491" stroke-width="1.6"/>
  <path d="M309,204 L309,216" stroke="#3a6491" stroke-width="1.6"/>
  <path d="M111,216 L309,216" stroke="#3a6491" stroke-width="1.6"/>
  <path d="M210,216 L210,232" stroke="#3a6491" stroke-width="2" marker-end="url(#gtb)"/>

  <rect x="85" y="234" width="250" height="46" rx="10" fill="#5b88b0"/>
  <text x="210" y="263" text-anchor="middle" font-size="13" fill="#ffffff">工具盘里的 <tspan font-family="monospace">busybox httpd</tspan></text>

  <path d="M210,280 L210,300" stroke="#3a6491" stroke-width="2" marker-end="url(#gtb)"/>

  <rect x="110" y="302" width="200" height="40" rx="10" fill="#ffffff" stroke="#5b88b0" stroke-width="1.6"/>
  <text x="210" y="327" text-anchor="middle" font-size="13" fill="#24476b">进程监管程序</text>

  <path d="M210,342 L210,362" stroke="#3a6491" stroke-width="2" marker-end="url(#gtb)"/>

  <rect x="110" y="364" width="200" height="40" rx="10" fill="#5b88b0"/>
  <text x="210" y="389" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">能执行命令 ✓</text>

  <!-- 左：被测代码没被走到 -->
  <path d="M312,322 L384,322" stroke="#6b87a3" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#gtg)"/>
  <text x="348" y="311" text-anchor="middle" font-size="11.5" font-weight="700" fill="#b5544a">未进入</text>

  <rect x="390" y="287" width="182" height="70" rx="10" fill="none" stroke="#6b87a3" stroke-width="1.6" stroke-dasharray="7 5"/>
  <text x="481" y="315" text-anchor="middle" font-size="13" fill="#6b87a3">读镜像启动配置<tspan x="481" dy="19">并原样施加</tspan></text>

  <text x="481" y="379" text-anchor="middle" font-size="11.5" font-weight="700" fill="#b5544a">这就是被测代码</text>
  <text x="481" y="398" text-anchor="middle" font-size="11.5" fill="#8c4a42">4 个样本一个都没走到</text>

  <text x="320" y="438" text-anchor="middle" font-size="14" font-weight="700" fill="#3a6491">对照组 0/4，看起来完美</text>

  <!-- 右：复核 -->
  <rect x="610" y="100" width="540" height="360" rx="14" fill="#ffffff" stroke="#b5544a" stroke-width="2.5"/>
  <text x="636" y="128" font-size="15" font-weight="700" fill="#b5544a">复核：补两个真实镜像</text>
  <text x="636" y="149" font-size="12" fill="#8c4a42">只换样本，被测代码和用例都没动</text>

  <rect x="688" y="162" width="180" height="48" rx="10" fill="#f6ebe9" stroke="#b5544a" stroke-width="1.6"/>
  <text x="778" y="183" text-anchor="middle" font-size="13" font-family="monospace" fill="#8c4a42">nginx</text>
  <text x="778" y="201" text-anchor="middle" font-size="11.5" fill="#8c4a42">自带启动配置的常见镜像</text>

  <rect x="892" y="162" width="180" height="48" rx="10" fill="#f6ebe9" stroke="#b5544a" stroke-width="1.6"/>
  <text x="982" y="183" text-anchor="middle" font-size="13" fill="#8c4a42">真实题目镜像</text>
  <text x="982" y="201" text-anchor="middle" font-size="11.5" fill="#8c4a42">线上真正在用的那种</text>

  <path d="M778,210 L778,238" stroke="#b5544a" stroke-width="2" marker-end="url(#gtr)"/>
  <path d="M982,210 L982,238" stroke="#b5544a" stroke-width="2" marker-end="url(#gtr)"/>

  <rect x="700" y="240" width="360" height="56" rx="10" fill="#ffffff" stroke="#b5544a" stroke-width="2.2"/>
  <text x="880" y="266" text-anchor="middle" font-size="13.5" font-weight="700" fill="#b5544a">读镜像启动配置并原样施加</text>
  <text x="880" y="285" text-anchor="middle" font-size="11.5" fill="#8c4a42">同一段被测代码，这次真的走进去了</text>

  <path d="M880,296 L880,316" stroke="#b5544a" stroke-width="2" marker-end="url(#gtr)"/>

  <rect x="660" y="318" width="440" height="44" rx="10" fill="#b5544a"/>
  <text x="880" y="345" text-anchor="middle" font-size="12.5" fill="#ffffff">bug 1：<tspan font-family="monospace">nginx</tspan> 的启动配置没被原样施加</text>

  <rect x="660" y="370" width="440" height="44" rx="10" fill="#b5544a"/>
  <text x="880" y="397" text-anchor="middle" font-size="12.5" fill="#ffffff">bug 2：真实题目镜像暴露的第二个问题</text>

  <text x="880" y="438" text-anchor="middle" font-size="14" font-weight="700" fill="#b5544a">立刻暴露 2 个 bug</text>

  <!-- 结论 -->
  <rect x="50" y="488" width="1100" height="82" rx="12" fill="#24476b"/>
  <text x="600" y="518" text-anchor="middle" font-size="14.5" font-weight="700" fill="#ffffff">绿灯要先证明样本走到了被测代码</text>
  <text x="600" y="544" text-anchor="middle" font-size="12.5" fill="#a9c4dc">成功率 100% 的压测只能证明压力不够——那批实验里有 2 批是故意打到拒绝的</text>
</svg>
