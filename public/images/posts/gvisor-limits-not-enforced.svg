<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">
  <rect width="1200" height="620" rx="20" fill="#f2f6fa"/>

  <text x="600" y="46" text-anchor="middle" font-size="21" font-weight="700" fill="#24476b">limits 写在 Pod spec 里，不等于内核会执行它</text>
  <text x="600" y="74" text-anchor="middle" font-size="14" fill="#6b87a3">sentry 与 stub 进程落在 Pod 的 cgroup 之外，上限失去约束力，而且不报任何错</text>

  <!-- runc -->
  <rect x="60" y="110" width="520" height="250" rx="14" fill="#ffffff" stroke="#3a6491" stroke-width="2"/>
  <text x="320" y="140" text-anchor="middle" font-size="16" font-weight="700" fill="#3a6491">runc（对照组）</text>

  <rect x="96" y="158" width="448" height="80" rx="10" fill="#eef5fa"/>
  <text x="320" y="182" text-anchor="middle" font-size="13" fill="#24476b">Pod 的 cgroup</text>
  <rect x="140" y="192" width="360" height="34" rx="8" fill="#24476b"/>
  <text x="320" y="214" text-anchor="middle" font-size="12.5" fill="#ffffff">容器进程全部在里面</text>

  <text x="200" y="272" text-anchor="middle" font-size="13" fill="#6b87a3">限额 1Gi 内存</text>
  <text x="200" y="300" text-anchor="middle" font-size="19" font-weight="700" fill="#24476b">700 MiB 被杀</text>
  <text x="200" y="322" text-anchor="middle" font-size="12" fill="#6b87a3">exit 137</text>

  <text x="440" y="272" text-anchor="middle" font-size="13" fill="#6b87a3">限额 1 核</text>
  <text x="440" y="300" text-anchor="middle" font-size="19" font-weight="700" fill="#24476b">稳在 0.50 核</text>
  <text x="440" y="322" text-anchor="middle" font-size="12" fill="#6b87a3">上限生效</text>

  <!-- gVisor -->
  <rect x="620" y="110" width="520" height="250" rx="14" fill="#ffffff" stroke="#b5544a" stroke-width="2.5"/>
  <text x="880" y="140" text-anchor="middle" font-size="16" font-weight="700" fill="#b5544a">gVisor（旧版 cgroup）</text>

  <rect x="656" y="158" width="448" height="80" rx="10" fill="#f6ebe9"/>
  <text x="880" y="180" text-anchor="middle" font-size="13" fill="#8c4a42">Pod 的 cgroup</text>
  <rect x="680" y="190" width="180" height="36" rx="8" fill="#24476b"/>
  <text x="770" y="213" text-anchor="middle" font-size="12" fill="#ffffff">应用进程</text>
  <rect x="890" y="190" width="190" height="36" rx="8" fill="none" stroke="#b5544a" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="985" y="213" text-anchor="middle" font-size="12" fill="#b5544a">sentry / stub 在框外</text>

  <text x="760" y="272" text-anchor="middle" font-size="13" fill="#8c4a42">同样限额 1Gi</text>
  <text x="760" y="300" text-anchor="middle" font-size="19" font-weight="700" fill="#b5544a">写满 1.5 GiB</text>
  <text x="760" y="322" text-anchor="middle" font-size="12" fill="#8c4a42">成功，无任何报错</text>

  <text x="1000" y="272" text-anchor="middle" font-size="13" fill="#8c4a42">同样限额 1 核</text>
  <text x="1000" y="300" text-anchor="middle" font-size="19" font-weight="700" fill="#b5544a">吃到 3.91 核</text>
  <text x="1000" y="322" text-anchor="middle" font-size="12" fill="#8c4a42">上限形同虚设</text>

  <!-- 五个条件 -->
  <rect x="60" y="388" width="1080" height="112" rx="14" fill="#ffffff" stroke="#c3d6e6" stroke-width="1.5"/>
  <text x="600" y="416" text-anchor="middle" font-size="14.5" font-weight="700" fill="#3a6491">要让上限真正生效，五个条件必须同时满足——缺一条就回到右边那种状态</text>
  <g font-size="12" fill="#24476b" text-anchor="middle">
    <rect x="92" y="432" width="196" height="48" rx="8" fill="#eef5fa"/>
    <text x="190" y="454">节点是 cgroup v2</text>
    <text x="190" y="472" font-size="11" fill="#6b87a3">v1 下直接失效</text>

    <rect x="304" y="432" width="196" height="48" rx="8" fill="#eef5fa"/>
    <text x="402" y="454">systemd ≥ 244</text>
    <text x="402" y="472" font-size="11" fill="#6b87a3">版本低也不行</text>

    <rect x="516" y="432" width="196" height="48" rx="8" fill="#eef5fa"/>
    <text x="614" y="454">每个容器都写 limits</text>
    <text x="614" y="472" font-size="11" fill="#6b87a3">漏一个就漏一片</text>

    <rect x="728" y="432" width="196" height="48" rx="8" fill="#eef5fa"/>
    <text x="826" y="448">runsc.toml 显式开</text>
    <text x="826" y="466" font-size="11" fill="#6b87a3">systemd-cgroup</text>

    <rect x="940" y="432" width="168" height="48" rx="8" fill="#eef5fa"/>
    <text x="1024" y="454">节点不开 swap</text>
    <text x="1024" y="472" font-size="11" fill="#6b87a3">开了内存限失准</text>
  </g>

  <rect x="60" y="518" width="1080" height="56" rx="12" fill="#24476b"/>
  <text x="600" y="543" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">兜底：节点组件在接受业务之前先自检上限到底生没生效，没生效就拒绝领取</text>
  <text x="600" y="564" text-anchor="middle" font-size="12.5" fill="#a9c4dc">比事后监控可靠——这类失效完全静默，没有任何错误可以告警</text>
</svg>
