<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">
  <rect width="1200" height="780" rx="20" fill="#f2f6fa"/>
  <defs>
    <marker id="blsa" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#5b88b0"/></marker>
    <marker id="blsb" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#b5544a"/></marker>
    <marker id="blsn" markerWidth="11" markerHeight="9" refX="10" refY="4.5" orient="auto"><path d="M0,0 L11,4.5 L0,9 z" fill="#24476b"/></marker>
    <marker id="blsg" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 z" fill="#c3d6e6"/></marker>
  </defs>

  <text x="600" y="44" text-anchor="middle" font-size="21" font-weight="700" fill="#24476b">一句报错的字节数比它的文字更能定位抛出点</text>
  <text x="600" y="72" text-anchor="middle" font-size="14" fill="#6b87a3">截图只给得出字数，实测只给得出字节数——长度是这两种证据唯一能对账的共同单位</text>

  <!-- ===== 第 1 栏：手上的两种证据 ===== -->
  <rect x="20" y="92" width="373" height="526" rx="14" fill="#ffffff" stroke="#c3d6e6" stroke-width="1.6"/>
  <circle cx="38" cy="115" r="9" fill="#eef5fa" stroke="#c3d6e6" stroke-width="1.2"/>
  <text x="38" y="119" text-anchor="middle" font-size="11" font-weight="700" fill="#6b87a3">1</text>
  <text x="54" y="120" font-size="14" font-weight="700" fill="#24476b">手上的两种证据</text>

  <!-- 上框：用户截图 -->
  <rect x="42" y="140" width="329" height="170" rx="8" fill="#ffffff"/>
  <path d="M42,148 a8,8 0 0 1 8,-8 h313 a8,8 0 0 1 8,8 v14 h-329 z" fill="#eef5fa"/>
  <line x1="42" y1="162" x2="371" y2="162" stroke="#c3d6e6" stroke-width="1.2"/>
  <circle cx="54" cy="151" r="3" fill="#c3d6e6"/>
  <circle cx="65" cy="151" r="3" fill="#c3d6e6"/>
  <circle cx="76" cy="151" r="3" fill="#c3d6e6"/>
  <text x="212" y="156" text-anchor="middle" font-size="10.5" fill="#6b87a3">用户发来的截图</text>
  <text x="206" y="186" text-anchor="middle" font-size="11" fill="#6b87a3">报错文案那一行</text>
  <rect x="72" y="198" width="16" height="16" rx="2" fill="#5b88b0"/>
  <rect x="93" y="198" width="16" height="16" rx="2" fill="#5b88b0"/>
  <rect x="114" y="198" width="16" height="16" rx="2" fill="#5b88b0"/>
  <rect x="135" y="198" width="16" height="16" rx="2" fill="#5b88b0"/>
  <rect x="156" y="198" width="16" height="16" rx="2" fill="#5b88b0"/>
  <rect x="177" y="198" width="16" height="16" rx="2" fill="#5b88b0"/>
  <rect x="198" y="198" width="16" height="16" rx="2" fill="#5b88b0"/>
  <rect x="219" y="198" width="16" height="16" rx="2" fill="#5b88b0"/>
  <rect x="240" y="198" width="16" height="16" rx="2" fill="#5b88b0"/>
  <rect x="261" y="198" width="16" height="16" rx="2" fill="#5b88b0"/>
  <rect x="282" y="198" width="16" height="16" rx="2" fill="#5b88b0"/>
  <rect x="303" y="198" width="16" height="16" rx="2" fill="#5b88b0"/>
  <rect x="324" y="198" width="16" height="16" rx="2" fill="#5b88b0"/>
  <line x1="72" y1="226" x2="340" y2="226" stroke="#5b88b0" stroke-width="1.4"/>
  <line x1="72" y1="221" x2="72" y2="231" stroke="#5b88b0" stroke-width="1.4"/>
  <line x1="340" y1="221" x2="340" y2="231" stroke="#5b88b0" stroke-width="1.4"/>
  <text x="206" y="254" text-anchor="middle" font-size="20" font-weight="700" fill="#5b88b0"><tspan font-family="monospace">13</tspan><tspan font-size="12" dx="4">个字</tspan></text>
  <text x="206" y="280" text-anchor="middle" font-size="10.5" fill="#6b87a3">一个方块 = 一个汉字</text>
  <rect x="42" y="140" width="329" height="170" rx="8" fill="none" stroke="#5b88b0" stroke-width="2"/>
  <text x="206" y="330" text-anchor="middle" font-size="11.5" fill="#3a6491">用户截图 — 字数数得出，文本复制不出来</text>

  <!-- 两种证据之间 -->
  <rect x="62" y="348" width="289" height="26" rx="13" fill="#f2f6fa" stroke="#c3d6e6" stroke-width="1.2" stroke-dasharray="4 4"/>
  <text x="206" y="365" text-anchor="middle" font-size="11.5" fill="#6b87a3">两种证据形态不同，没法直接对账</text>

  <!-- 下框：实测响应头 -->
  <rect x="42" y="392" width="329" height="150" rx="8" fill="#ffffff"/>
  <path d="M42,400 a8,8 0 0 1 8,-8 h313 a8,8 0 0 1 8,8 v14 h-329 z" fill="#f6ebe9"/>
  <line x1="42" y1="414" x2="371" y2="414" stroke="#d8c2bf" stroke-width="1.2"/>
  <text x="56" y="408" font-size="10.5" fill="#8c4a42">实测响应头</text>
  <text x="60" y="450" font-size="13.5" font-family="monospace" fill="#24476b">HTTP/1.1 401</text>
  <text x="60" y="482" font-size="13.5" font-family="monospace" fill="#24476b">content-length:<tspan font-size="18" font-weight="700" fill="#b5544a" dx="6">52</tspan></text>
  <text x="206" y="516" text-anchor="middle" font-size="11" fill="#8c4a42">能直接对账的只有这个数字</text>
  <rect x="42" y="392" width="329" height="150" rx="8" fill="none" stroke="#b5544a" stroke-width="2"/>
  <text x="206" y="562" text-anchor="middle" font-size="11.5" fill="#3a6491">实测响应 — 拿得到 52 字节，看不到文案</text>
  <text x="206" y="592" text-anchor="middle" font-size="11" fill="#6b87a3">一边是字数，一边是字节数</text>

  <!-- 栏间箭头 1 -->
  <path d="M397,225 L417,225" stroke="#5b88b0" stroke-width="2" marker-end="url(#blsa)"/>
  <path d="M397,467 L417,467" stroke="#b5544a" stroke-width="2" marker-end="url(#blsb)"/>

  <!-- ===== 第 2 栏：长度是能对账的共同单位 ===== -->
  <rect x="423" y="92" width="373" height="526" rx="14" fill="#ffffff" stroke="#c3d6e6" stroke-width="1.6"/>
  <circle cx="441" cy="115" r="9" fill="#eef5fa" stroke="#c3d6e6" stroke-width="1.2"/>
  <text x="441" y="119" text-anchor="middle" font-size="11" font-weight="700" fill="#6b87a3">2</text>
  <text x="457" y="120" font-size="14" font-weight="700" fill="#24476b">长度是能对账的共同单位</text>

  <!-- 大算式：两种证据在这里合流 -->
  <rect x="441" y="152" width="337" height="60" rx="10" fill="#eef5fa" stroke="#c3d6e6" stroke-width="1.2"/>
  <text x="452" y="192" font-size="22" font-weight="700" font-family="monospace" fill="#b5544a">52</text>
  <text x="490" y="192" font-size="19" fill="#6b87a3">=</text>
  <text x="513" y="192" font-size="22" font-weight="700" fill="#5b88b0"><tspan font-family="monospace">13</tspan><tspan dx="4">字</tspan></text>
  <text x="574" y="192" font-size="19" fill="#6b87a3">×</text>
  <text x="597" y="192" font-size="22" fill="#24476b"><tspan font-family="monospace">3</tspan><tspan dx="4">字节</tspan></text>
  <text x="667" y="192" font-size="19" fill="#6b87a3">+</text>
  <text x="690" y="192" font-size="22" fill="#24476b"><tspan font-family="monospace">13</tspan><tspan dx="4">字节</tspan></text>

  <path d="M627,214 L627,226" stroke="#c3d6e6" stroke-width="1.4" fill="none"/>
  <text x="627" y="240" text-anchor="middle" font-size="11" fill="#6b87a3">UTF-8 一个常用汉字 3 字节</text>
  <path d="M726,214 L726,252 L700,252" stroke="#c3d6e6" stroke-width="1.4" fill="none"/>
  <text x="694" y="268" text-anchor="middle" font-size="11" font-family="monospace" fill="#6b87a3">{"detail":"..."}</text>
  <text x="694" y="284" text-anchor="middle" font-size="11" fill="#6b87a3">这层空壳紧凑算 13 字节</text>

  <!-- 排除表：四种组合只有一种全整除 -->
  <rect x="441" y="312" width="337" height="26" rx="6" fill="#f2f6fa" stroke="#c3d6e6" stroke-width="1.2"/>
  <text x="471" y="330" text-anchor="middle" font-size="11" font-weight="700" fill="#6b87a3">信封</text>
  <text x="541" y="330" text-anchor="middle" font-size="11" font-weight="700" fill="#6b87a3">每字字节</text>
  <text x="679" y="330" text-anchor="middle" font-size="11" font-weight="700" fill="#6b87a3">三个数反推出的字数</text>
  <line x1="501" y1="312" x2="501" y2="458" stroke="#c3d6e6" stroke-width="0.8"/>
  <line x1="581" y1="312" x2="581" y2="458" stroke="#c3d6e6" stroke-width="0.8"/>
  <line x1="441" y1="398" x2="778" y2="398" stroke="#c3d6e6" stroke-width="0.8"/>
  <line x1="441" y1="428" x2="778" y2="428" stroke="#c3d6e6" stroke-width="0.8"/>

  <rect x="441" y="338" width="337" height="30" rx="6" fill="#eef5fa" stroke="#24476b" stroke-width="2"/>
  <text x="471" y="358" text-anchor="middle" font-size="12" font-weight="700" font-family="monospace" fill="#24476b">13</text>
  <text x="541" y="358" text-anchor="middle" font-size="12" font-weight="700" font-family="monospace" fill="#24476b">3</text>
  <text x="625" y="358" text-anchor="middle" font-size="12" font-weight="700" font-family="monospace" fill="#24476b">8</text>
  <text x="652" y="358" text-anchor="middle" font-size="11" fill="#6b87a3">/</text>
  <text x="679" y="358" text-anchor="middle" font-size="12" font-weight="700" font-family="monospace" fill="#24476b">14</text>
  <text x="706" y="358" text-anchor="middle" font-size="11" fill="#6b87a3">/</text>
  <text x="733" y="358" text-anchor="middle" font-size="12" font-weight="700" font-family="monospace" fill="#24476b">13</text>
  <text x="762" y="359" text-anchor="middle" font-size="13" font-weight="700" fill="#24476b">✓</text>

  <text x="471" y="388" text-anchor="middle" font-size="12" font-family="monospace" fill="#6b87a3">13</text>
  <text x="541" y="388" text-anchor="middle" font-size="12" font-family="monospace" fill="#6b87a3">6</text>
  <text x="625" y="388" text-anchor="middle" font-size="12" font-family="monospace" fill="#6b87a3">4</text>
  <text x="652" y="388" text-anchor="middle" font-size="11" fill="#c3d6e6">/</text>
  <text x="679" y="388" text-anchor="middle" font-size="12" font-family="monospace" fill="#6b87a3">7</text>
  <text x="706" y="388" text-anchor="middle" font-size="11" fill="#c3d6e6">/</text>
  <text x="733" y="388" text-anchor="middle" font-size="12" font-family="monospace" fill="#6b87a3">6.5</text>
  <line x1="719" y1="384" x2="747" y2="384" stroke="#6b87a3" stroke-width="1.4"/>

  <text x="471" y="418" text-anchor="middle" font-size="12" font-family="monospace" fill="#6b87a3">14</text>
  <text x="541" y="418" text-anchor="middle" font-size="12" font-family="monospace" fill="#6b87a3">3</text>
  <text x="625" y="418" text-anchor="middle" font-size="12" font-family="monospace" fill="#6b87a3">7.67</text>
  <text x="652" y="418" text-anchor="middle" font-size="11" fill="#c3d6e6">/</text>
  <text x="679" y="418" text-anchor="middle" font-size="12" font-family="monospace" fill="#6b87a3">13.67</text>
  <text x="706" y="418" text-anchor="middle" font-size="11" fill="#c3d6e6">/</text>
  <text x="733" y="418" text-anchor="middle" font-size="12" font-family="monospace" fill="#6b87a3">12.67</text>
  <line x1="608" y1="414" x2="642" y2="414" stroke="#6b87a3" stroke-width="1.4"/>
  <line x1="659" y1="414" x2="699" y2="414" stroke="#6b87a3" stroke-width="1.4"/>
  <line x1="713" y1="414" x2="753" y2="414" stroke="#6b87a3" stroke-width="1.4"/>

  <text x="471" y="448" text-anchor="middle" font-size="12" font-family="monospace" fill="#6b87a3">14</text>
  <text x="541" y="448" text-anchor="middle" font-size="12" font-family="monospace" fill="#6b87a3">6</text>
  <text x="625" y="448" text-anchor="middle" font-size="12" font-family="monospace" fill="#6b87a3">3.83</text>
  <text x="652" y="448" text-anchor="middle" font-size="11" fill="#c3d6e6">/</text>
  <text x="679" y="448" text-anchor="middle" font-size="12" font-family="monospace" fill="#6b87a3">6.83</text>
  <text x="706" y="448" text-anchor="middle" font-size="11" fill="#c3d6e6">/</text>
  <text x="733" y="448" text-anchor="middle" font-size="12" font-family="monospace" fill="#6b87a3">6.33</text>
  <line x1="608" y1="444" x2="642" y2="444" stroke="#6b87a3" stroke-width="1.4"/>
  <line x1="662" y1="444" x2="696" y2="444" stroke="#6b87a3" stroke-width="1.4"/>
  <line x1="716" y1="444" x2="750" y2="444" stroke="#6b87a3" stroke-width="1.4"/>

  <text x="609" y="478" text-anchor="middle" font-size="11.5" fill="#3a6491">划掉的是除不尽的数，四种组合只有一组全整除</text>
  <text x="609" y="496" text-anchor="middle" font-size="11.5" fill="#3a6491">→ 信封紧凑分隔符 13 字节，汉字 UTF-8 原样 3 字节</text>

  <rect x="441" y="552" width="337" height="34" rx="10" fill="#6b87a3"/>
  <text x="609" y="574" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">余数不是 3 的倍数 = 文案带变量 = 指纹失效</text>

  <!-- ===== 第 3 栏：鉴权链三级 ===== -->
  <rect x="826" y="92" width="354" height="526" rx="14" fill="#ffffff" stroke="#c3d6e6" stroke-width="1.6"/>
  <circle cx="844" cy="115" r="9" fill="#eef5fa" stroke="#c3d6e6" stroke-width="1.2"/>
  <text x="844" y="119" text-anchor="middle" font-size="11" font-weight="700" fill="#6b87a3">3</text>
  <text x="860" y="120" font-size="14" font-weight="700" fill="#24476b">鉴权链三级，各一句文案</text>

  <rect x="846" y="150" width="252" height="86" rx="10" fill="#ffffff" stroke="#c3d6e6" stroke-width="1.6"/>
  <text x="972" y="176" text-anchor="middle" font-size="12.5" font-weight="700" fill="#6b87a3">第 1 级 · 凭证不对</text>
  <text x="972" y="199" text-anchor="middle" font-size="12" font-family="monospace" fill="#6b87a3">content-length 37</text>
  <text x="972" y="221" text-anchor="middle" font-size="11.5" fill="#6b87a3">= 8 字</text>

  <path d="M972,238 L972,256" stroke="#c3d6e6" stroke-width="1.6" marker-end="url(#blsg)"/>

  <rect x="846" y="262" width="252" height="86" rx="10" fill="#eef5fa" stroke="#24476b" stroke-width="2.6"/>
  <text x="972" y="288" text-anchor="middle" font-size="13" font-weight="700" fill="#24476b">第 2 级 · 身份对不上</text>
  <text x="972" y="311" text-anchor="middle" font-size="12.5" font-family="monospace" fill="#24476b">content-length <tspan font-size="14" font-weight="700" fill="#b5544a">52</tspan></text>
  <text x="972" y="334" text-anchor="middle" font-size="12" fill="#24476b">= <tspan font-weight="700" fill="#5b88b0">13 字</tspan></text>

  <path d="M972,350 L972,368" stroke="#c3d6e6" stroke-width="1.6" marker-end="url(#blsg)"/>

  <rect x="846" y="374" width="252" height="86" rx="10" fill="#ffffff" stroke="#c3d6e6" stroke-width="1.6"/>
  <text x="972" y="400" text-anchor="middle" font-size="12.5" font-weight="700" fill="#6b87a3">第 3 级 · 权限不够</text>
  <text x="972" y="423" text-anchor="middle" font-size="12" font-family="monospace" fill="#6b87a3">content-length 55</text>
  <text x="972" y="445" text-anchor="middle" font-size="11.5" fill="#6b87a3">= 14 字</text>

  <!-- 从算式横穿过来：字数命中其中一级 -->
  <path d="M780,192 L814,192 L814,305 L841,305" fill="none" stroke="#24476b" stroke-width="2.2" marker-end="url(#blsn)"/>
  <text transform="rotate(-90 806 262)" x="806" y="262" text-anchor="middle" font-size="11" font-weight="700" fill="#24476b">字数 13 → 唯一命中</text>

  <!-- 三级合并：对外都是 401 -->
  <path d="M1108,152 q10,0 10,14 v124 q0,14 10,15 q-10,1 -10,15 v124 q0,14 -10,14" fill="none" stroke="#6b87a3" stroke-width="2"/>
  <text transform="rotate(-90 1154 305)" x="1154" y="305" text-anchor="middle" font-size="13" font-weight="700" fill="#24476b">对外都是 401</text>
  <text x="972" y="484" text-anchor="middle" font-size="11.5" fill="#6b87a3">状态码区分不了这三级</text>

  <rect x="846" y="530" width="310" height="62" rx="8" fill="#f2f6fa" stroke="#c3d6e6" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="1001" y="554" text-anchor="middle" font-size="10.5" fill="#6b87a3">37 / 55 落在哪一级是示意画法</text>
  <text x="1001" y="574" text-anchor="middle" font-size="10.5" fill="#6b87a3">文中确证的只有 52 字节 = 13 字 = 用户截图那一级</text>

  <!-- ===== 底部通栏：四条失效条件 ===== -->
  <rect x="20" y="632" width="1160" height="128" rx="14" fill="#24476b"/>
  <text x="44" y="660" font-size="14.5" font-weight="700" fill="#ffffff">四条失效条件：踩中任意一条，上面这条换算链就不成立</text>
  <text x="1156" y="660" text-anchor="end" font-size="11.5" fill="#a9c4dc">前三条是方法本身的边界，第四条是样本量</text>

  <rect x="44" y="672" width="266" height="76" rx="10" fill="none" stroke="#5b88b0" stroke-width="1.2"/>
  <text x="177" y="696" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">响应被压缩</text>
  <text x="177" y="718" text-anchor="middle" font-size="11" fill="#a9c4dc"><tspan font-family="monospace">content-length</tspan> 是压缩后的</text>
  <text x="177" y="736" text-anchor="middle" font-size="11" fill="#a9c4dc">字节数，和文案长度无关</text>

  <rect x="326" y="672" width="266" height="76" rx="10" fill="none" stroke="#5b88b0" stroke-width="1.2"/>
  <text x="459" y="696" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">文案带变量</text>
  <text x="459" y="718" text-anchor="middle" font-size="11" fill="#a9c4dc">长度不是常量，减掉信封</text>
  <text x="459" y="736" text-anchor="middle" font-size="11" fill="#a9c4dc">除不尽 3 就当场发现</text>

  <rect x="608" y="672" width="266" height="76" rx="10" fill="none" stroke="#5b88b0" stroke-width="1.2"/>
  <text x="741" y="696" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">长度碰撞</text>
  <text x="741" y="718" text-anchor="middle" font-size="11" fill="#a9c4dc">字数相同的候选是常态</text>
  <text x="741" y="736" text-anchor="middle" font-size="11" fill="#a9c4dc">它只是筛子，不是定位</text>

  <rect x="890" y="672" width="266" height="76" rx="10" fill="none" stroke="#5b88b0" stroke-width="1.2"/>
  <text x="1023" y="696" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">只验过一个框架</text>
  <text x="1023" y="718" text-anchor="middle" font-size="11" fill="#a9c4dc">信封长度随框架变</text>
  <text x="1023" y="736" text-anchor="middle" font-size="11" fill="#a9c4dc">别的框架没测过</text>
</svg>
