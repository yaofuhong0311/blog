<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="676" viewBox="0 0 1200 676" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">
  <rect width="1200" height="676" rx="20" fill="#f2f6fa"/>
  <defs>
    <marker id="cmx" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 z" fill="#3a6491"/></marker>
  </defs>

  <text x="600" y="44" text-anchor="middle" font-size="21" font-weight="700" fill="#24476b">契约里的「做不到」，在代码里只能有一个出处</text>
  <text x="600" y="72" text-anchor="middle" font-size="14" fill="#6b87a3">缺口只分支持 / 不支持就不够用；同一条判断散成两份，就会无声漂移</text>

  <line x1="600" y1="104" x2="600" y2="566" stroke="#c3d6e6" stroke-width="1.5"/>

  <text x="315" y="118" text-anchor="middle" font-size="15" font-weight="700" fill="#24476b">一格缺口的三种写法</text>
  <text x="885" y="118" text-anchor="middle" font-size="15" font-weight="700" fill="#24476b">判定有几份副本</text>

  <!-- 左栏 1：真适配 -->
  <rect x="66" y="136" width="498" height="122" rx="12" fill="#ffffff" stroke="#5b88b0" stroke-width="1.6"/>
  <circle cx="88" cy="160" r="11" fill="#5b88b0"/>
  <text x="88" y="164.5" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">1</text>
  <text x="108" y="165" font-size="15" font-weight="700" fill="#24476b">真适配</text>
  <text x="164" y="165" font-size="12" fill="#6b87a3">接上运行时自己的原生机制</text>
  <rect x="84" y="180" width="462" height="66" rx="8" fill="#eef5fa"/>
  <text x="98" y="200" font-size="12" fill="#3a6491">系统指令 → <tspan font-family="monospace" fill="#24476b">--append-system-prompt</tspan></text>
  <text x="98" y="220" font-size="12" fill="#3a6491">思考预算 → <tspan font-family="monospace" fill="#24476b">MAX_THINKING_TOKENS</tspan>　关 0 / 高 16384</text>
  <text x="98" y="240" font-size="12" fill="#3a6491">另一运行时 → <tspan font-family="monospace" fill="#24476b">model_reasoning_effort</tspan>　超出枚举钳到 high</text>

  <!-- 左栏 2：降级 + notice -->
  <rect x="66" y="270" width="498" height="122" rx="12" fill="#ffffff" stroke="#5b88b0" stroke-width="1.6"/>
  <circle cx="88" cy="294" r="11" fill="#5b88b0"/>
  <text x="88" y="298.5" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">2</text>
  <text x="108" y="299" font-size="15" font-weight="700" fill="#24476b">降级 + notice</text>
  <text x="212" y="299" font-size="12" fill="#6b87a3">原生通道不在服务端手里</text>
  <rect x="84" y="314" width="462" height="66" rx="8" fill="#eef5fa"/>
  <text x="98" y="334" font-size="12" fill="#3a6491">原生通道是工作目录下的 <tspan font-family="monospace" fill="#24476b">AGENTS.md</tspan></text>
  <text x="98" y="354" font-size="12" fill="#3a6491">服务端不代写：会覆盖调用方的文件，会被自动提交打进包</text>
  <text x="98" y="374" font-size="12" fill="#3a6491">这一格的处理是不做，回一条 <tspan font-family="monospace" fill="#24476b">notice</tspan> 让调用方自己写</text>

  <!-- 左栏 3：自动改路 -->
  <rect x="66" y="404" width="498" height="96" rx="12" fill="#ffffff" stroke="#5b88b0" stroke-width="1.6"/>
  <circle cx="88" cy="428" r="11" fill="#5b88b0"/>
  <text x="88" y="432.5" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">3</text>
  <text x="108" y="433" font-size="15" font-weight="700" fill="#24476b">自动改路</text>
  <text x="182" y="433" font-size="12" fill="#6b87a3">字段读不到就换条路径</text>
  <rect x="84" y="448" width="462" height="44" rx="8" fill="#eef5fa"/>
  <text x="98" y="468" font-size="12" fill="#3a6491">请求里带了常驻路径读不到的字段</text>
  <text x="98" y="486" font-size="12" fill="#3a6491">这一轮自动换到一次性路径上跑，让字段真的生效</text>

  <path d="M315,500 L315,514" stroke="#3a6491" stroke-width="1.8" marker-end="url(#cmx)"/>

  <!-- 左栏横贯说明 -->
  <rect x="66" y="518" width="498" height="48" rx="10" fill="#f6ebe9" stroke="#b5544a" stroke-width="1.6"/>
  <text x="315" y="540" text-anchor="middle" font-size="12.5" font-weight="700" fill="#b5544a">两档矩阵把 2 和 3 压成同一格</text>
  <text x="315" y="558" text-anchor="middle" font-size="11.5" fill="#8c4a42">「不支持」既可能是真的不做，也可能是换条路跑完了</text>

  <!-- 右栏 1：能力缺口 -->
  <rect x="636" y="136" width="498" height="98" rx="12" fill="#ffffff" stroke="#c3d6e6" stroke-width="1.6"/>
  <text x="654" y="164" font-size="13.5" font-weight="700" fill="#24476b">能力缺口</text>
  <rect x="890" y="147" width="122" height="24" rx="12" fill="#5b88b0"/>
  <text x="951" y="163.5" text-anchor="middle" font-size="12" fill="#ffffff">2 份 → 1 份</text>
  <rect x="1024" y="147" width="94" height="24" rx="12" fill="#eef5fa" stroke="#5b88b0" stroke-width="1.4"/>
  <text x="1071" y="163.5" text-anchor="middle" font-size="11.5" font-weight="700" fill="#24476b">已消</text>
  <text x="654" y="194" font-size="12" fill="#6b87a3">原先：路由判断一份，<tspan font-family="monospace">notice</tspan> 文案一份</text>
  <text x="654" y="214" font-size="12" fill="#3a6491">现在：常量 <tspan font-family="monospace" fill="#24476b">RESIDENT_UNSUPPORTED_FIELDS</tspan> 同时驱动两者</text>

  <!-- 右栏 2：查询参数合法集 -->
  <rect x="636" y="246" width="498" height="98" rx="12" fill="#ffffff" stroke="#c3d6e6" stroke-width="1.6"/>
  <text x="654" y="274" font-size="13.5" font-weight="700" fill="#24476b">查询参数合法集</text>
  <rect x="890" y="257" width="122" height="24" rx="12" fill="#5b88b0"/>
  <text x="951" y="273.5" text-anchor="middle" font-size="12" fill="#ffffff">2 份 → 1 份</text>
  <rect x="1024" y="257" width="94" height="24" rx="12" fill="#eef5fa" stroke="#5b88b0" stroke-width="1.4"/>
  <text x="1071" y="273.5" text-anchor="middle" font-size="11.5" font-weight="700" fill="#24476b">已消</text>
  <text x="654" y="304" font-size="12" fill="#6b87a3">原先：路由自己的声明一份，手写的合法清单一份</text>
  <text x="654" y="324" font-size="12" fill="#3a6491">现在：递归读 <tspan font-family="monospace" fill="#24476b">route.dependant</tspan>，挂在 router 级依赖上</text>

  <!-- 右栏 3：模型名映射，仍有两份 -->
  <rect x="636" y="356" width="498" height="98" rx="12" fill="#f6ebe9" stroke="#b5544a" stroke-width="2"/>
  <text x="654" y="384" font-size="13.5" font-weight="700" fill="#b5544a">模型名映射（改之前）</text>
  <rect x="890" y="367" width="122" height="24" rx="12" fill="#b5544a"/>
  <text x="951" y="383.5" text-anchor="middle" font-size="12" fill="#ffffff">2 份</text>
  <rect x="1024" y="367" width="94" height="24" rx="12" fill="#b5544a"/>
  <text x="1071" y="383.5" text-anchor="middle" font-size="11.5" font-weight="700" fill="#ffffff">仍有两份</text>
  <text x="654" y="414" font-size="12" fill="#8c4a42">上游一份白名单，下游一份白名单</text>
  <text x="654" y="434" font-size="12" fill="#8c4a42">改过两次（回退值、不带版本号的处理），副本都没消掉</text>

  <!-- 右栏 4：模型名映射最终 -->
  <rect x="636" y="466" width="498" height="98" rx="12" fill="#ffffff" stroke="#24476b" stroke-width="2"/>
  <text x="654" y="494" font-size="13.5" font-weight="700" fill="#24476b">模型名映射（最终）</text>
  <rect x="890" y="477" width="122" height="24" rx="12" fill="#24476b"/>
  <text x="951" y="493.5" text-anchor="middle" font-size="12" fill="#ffffff">1 份</text>
  <rect x="1024" y="477" width="94" height="24" rx="12" fill="#eef5fa" stroke="#5b88b0" stroke-width="1.4"/>
  <text x="1071" y="493.5" text-anchor="middle" font-size="11.5" font-weight="700" fill="#24476b">已消</text>
  <text x="654" y="524" font-size="12" fill="#3a6491">上游原样透传，归一化只在下游做一次</text>
  <text x="654" y="544" font-size="12" fill="#3a6491">流开始时下游回传这一轮实跑的模型，前端照着它显示</text>

  <!-- 结论 -->
  <rect x="50" y="582" width="1100" height="72" rx="12" fill="#24476b"/>
  <text x="600" y="610" text-anchor="middle" font-size="14.5" font-weight="700" fill="#ffffff">契约里每一条「这里做不到什么」，在代码里只能有一个出处</text>
  <text x="600" y="635" text-anchor="middle" font-size="12.5" fill="#a9c4dc">由它同时决定行为和回给调用方的那句话；跨进程的那份副本，只能等下游报回实际值</text>
</svg>
