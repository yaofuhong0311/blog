<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">
  <rect width="1200" height="660" rx="20" fill="#f2f6fa"/>
  <defs>
    <marker id="idk-b" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#3a6491"/></marker>
    <marker id="idk-r" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#b5544a"/></marker>
  </defs>

  <text x="600" y="44" text-anchor="middle" font-size="21" font-weight="700" fill="#24476b">同一个幂等键，两个调用方</text>
  <text x="600" y="72" text-anchor="middle" font-size="14" fill="#6b87a3">幂等匹配的作用域得服务端自己划，不能全托给调用方给的那个字符串</text>

  <!-- 左：改前 -->
  <rect x="50" y="96" width="540" height="390" rx="14" fill="#ffffff" stroke="#b5544a" stroke-width="2"/>
  <text x="76" y="122" font-size="15" font-weight="700" fill="#b5544a">改前：摘要 = <tspan font-family="monospace">sha256(key)</tspan></text>

  <rect x="72" y="142" width="228" height="54" rx="10" fill="#5b88b0"/>
  <text x="186" y="165" text-anchor="middle" font-size="13" fill="#ffffff">alice 带一个键先到</text>
  <text x="186" y="184" text-anchor="middle" font-size="11" font-family="monospace" fill="#dce9ff">key = nightly-eval</text>

  <path d="M300,169 L338,169" stroke="#3a6491" stroke-width="2" marker-end="url(#idk-b)"/>

  <rect x="344" y="142" width="224" height="54" rx="10" fill="#ffffff" stroke="#5b88b0" stroke-width="1.6"/>
  <text x="456" y="165" text-anchor="middle" font-size="12.5" fill="#24476b">建出沙箱 A · 2 核 4G</text>
  <text x="456" y="184" text-anchor="middle" font-size="11" font-family="monospace" fill="#3a6491">metadata idem = d1</text>

  <text x="320" y="214" text-anchor="middle" font-size="11" fill="#6b87a3">沙箱 A 挂的是 {盘根}/alice/ 下的四个目录</text>

  <rect x="72" y="232" width="228" height="60" rx="10" fill="#b5544a"/>
  <text x="186" y="258" text-anchor="middle" font-size="13" fill="#ffffff">bob 带同一个键后到</text>
  <text x="186" y="278" text-anchor="middle" font-size="11.5" fill="#f0d9d6">算出同一个 d1</text>

  <path d="M300,262 L338,262" stroke="#b5544a" stroke-width="2" marker-end="url(#idk-r)"/>

  <rect x="344" y="232" width="224" height="60" rx="10" fill="#f6ebe9" stroke="#b5544a" stroke-width="1.6"/>
  <text x="456" y="253" text-anchor="middle" font-size="12.5" font-weight="700" fill="#8c4a42">两条路都命中，不新建</text>
  <text x="456" y="271" text-anchor="middle" font-size="11" fill="#8c4a42">
    <tspan x="456">同副本：占位表按原始键命中</tspan>
    <tspan x="456" dy="16">跨副本：引擎列举按 d1 命中</tspan>
  </text>

  <path d="M456,292 L456,320" stroke="#b5544a" stroke-width="2.5" marker-end="url(#idk-r)"/>

  <rect x="72" y="326" width="496" height="56" rx="10" fill="#8c4a42"/>
  <text x="320" y="349" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff"><tspan font-family="monospace">201</tspan> 拿到沙箱 A，bob 的读写落进 {盘根}/alice/</text>
  <text x="320" y="369" text-anchor="middle" font-size="11.5" fill="#f0d9d6"><tspan font-family="monospace">exec</tspan> 正常返回、文件读得到，只是读到的不是自己的文件</text>

  <rect x="72" y="394" width="496" height="68" rx="10" fill="#ffffff" stroke="#c3d6e6"/>
  <text x="86" y="416" font-size="11.5" fill="#24476b">
    <tspan x="86">生产部署是单副本（副本数写的是 1），占位表才是主路径</tspan>
    <tspan x="86" dy="19" fill="#6b87a3">摘要写进沙箱 metadata 之后，窗口是沙箱活着的全程、任意副本</tspan>
    <tspan x="86" dy="19" fill="#6b87a3">占位表的键发布后不删，到 1 万条 FIFO 淘汰或进程重启才失效</tspan>
  </text>

  <!-- 右：改后 -->
  <rect x="610" y="96" width="540" height="390" rx="14" fill="#ffffff" stroke="#24476b" stroke-width="2.5"/>
  <text x="636" y="122" font-size="15" font-weight="700" fill="#24476b">改后：摘要 = <tspan font-family="monospace">sha256(作用域 | key)</tspan>，作用域含租户</text>

  <rect x="632" y="142" width="238" height="54" rx="10" fill="#ffffff" stroke="#5b88b0" stroke-width="1.6"/>
  <text x="751" y="164" text-anchor="middle" font-size="12.5" fill="#24476b">alice 算出 d1</text>
  <text x="751" y="183" text-anchor="middle" font-size="10.5" font-family="monospace" fill="#3a6491">sha256("5:alice|nightly-eval")</text>

  <rect x="890" y="142" width="238" height="54" rx="10" fill="#ffffff" stroke="#5b88b0" stroke-width="1.6"/>
  <text x="1009" y="164" text-anchor="middle" font-size="12.5" fill="#24476b">bob 算出 d2</text>
  <text x="1009" y="183" text-anchor="middle" font-size="10.5" font-family="monospace" fill="#3a6491">sha256("3:bob|nightly-eval")</text>

  <text x="880" y="214" text-anchor="middle" font-size="11" fill="#6b87a3">长度前缀不能省：否则 owner="ab"+key="cd" 和 owner="a"+key="bcd" 拼出同一个串</text>

  <rect x="632" y="230" width="496" height="52" rx="10" fill="#24476b"/>
  <text x="880" y="252" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">d1 ≠ d2 → bob 未命中 → 新建沙箱 B</text>
  <text x="880" y="271" text-anchor="middle" font-size="11.5" fill="#a9c4dc">B 挂的是 {盘根}/bob/；没传归属时退回整个请求体的指纹兜底</text>

  <text x="636" y="310" font-size="12.5" font-weight="700" fill="#24476b">认领这一步串两道关卡</text>

  <rect x="632" y="320" width="228" height="84" rx="10" fill="#eef5fa" stroke="#c3d6e6"/>
  <text x="646" y="341" font-size="11.5" font-weight="700" fill="#24476b">① 带 metadata 过滤去列举</text>
  <text x="646" y="361" font-size="11" fill="#6b87a3">
    <tspan x="646">分页参数是 <tspan font-family="monospace">pageSize</tspan></tspan>
    <tspan x="646" dy="19">旧写法 <tspan font-family="monospace">limit</tspan> 不是引擎认的</tspan>
    <tspan x="646" dy="19">参数名，传了等于没限制</tspan>
  </text>

  <path d="M864,362 L884,362" stroke="#3a6491" stroke-width="2" marker-end="url(#idk-b)"/>

  <rect x="890" y="320" width="238" height="84" rx="10" fill="#eef5fa" stroke="#c3d6e6"/>
  <text x="904" y="341" font-size="11.5" font-weight="700" fill="#24476b">② 认领前自己再核一遍</text>
  <text x="904" y="361" font-size="11" fill="#6b87a3">
    <tspan x="904">逐条比对沙箱上记的摘要</tspan>
    <tspan x="904" dy="19">和归属，对不上就当没查到，</tspan>
    <tspan x="904" dy="19">照常新建</tspan>
  </text>

  <rect x="632" y="416" width="496" height="56" rx="10" fill="#f6ebe9" stroke="#b5544a" stroke-width="1.6"/>
  <text x="646" y="437" font-size="11.5" fill="#8c4a42">
    <tspan x="646">服务密钥全集群共用：过滤一旦失效，<tspan font-family="monospace">GET /v1/sandboxes</tspan> 返回所有人的沙箱</tspan>
    <tspan x="646" dy="19">保留键 <tspan font-family="monospace">idem</tspan> / <tspan font-family="monospace">idem_owner</tspan> 从调用方输入里剔掉，只能由服务端写</tspan>
  </text>

  <!-- 三处同一摘要 -->
  <rect x="50" y="500" width="1100" height="52" rx="12" fill="#eef5fa" stroke="#c3d6e6"/>
  <text x="600" y="522" text-anchor="middle" font-size="13" font-weight="700" fill="#24476b">三处作用域必须用同一个摘要：进程内占位表 · 沙箱 metadata · 认领前的核对</text>
  <text x="600" y="541" text-anchor="middle" font-size="11.5" fill="#6b87a3">第一稿只给跨副本那条加了租户，同副本的占位表还按原始键索引——半截修复正好补在次要的那条路上</text>

  <!-- 结论 -->
  <rect x="50" y="566" width="1100" height="80" rx="12" fill="#24476b"/>
  <text x="600" y="594" text-anchor="middle" font-size="14.5" font-weight="700" fill="#ffffff">两种错不对称，所以故意往「多建」那边偏</text>
  <text x="600" y="619" text-anchor="middle" font-size="12.5" fill="#a9c4dc">
    <tspan x="600">查不动的时候（超时、4xx、应答不是 JSON）一律按没查到处理，继续新建</tspan>
    <tspan x="600" dy="19">多建一个沙箱浪费 2 核 4G，认错一个是把别人的工作区交出去</tspan>
  </text>
</svg>
