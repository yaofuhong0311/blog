<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="648" viewBox="0 0 1200 648" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">
  <rect width="1200" height="648" rx="20" fill="#f2f6fa"/>
  <defs>
    <marker id="edp-a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#3a6491"/></marker>
    <marker id="edp-r" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#b5544a"/></marker>
    <marker id="edp-w" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#ffffff"/></marker>
  </defs>

  <text x="600" y="44" text-anchor="middle" font-size="21" font-weight="700" fill="#24476b">合并前问「漏没漏代码」，四个 git 命令三个会答错</text>
  <text x="600" y="72" text-anchor="middle" font-size="14" fill="#6b87a3">合并前的检查只能用来筛选；证据只有一个——合完之后重新比一次</text>

  <!-- 左：复现场景 -->
  <rect x="50" y="96" width="380" height="244" rx="14" fill="#ffffff" stroke="#c3d6e6" stroke-width="1.6"/>
  <text x="72" y="122" font-size="14" font-weight="700" fill="#24476b">复现：develop 内容上已包含 feature/x</text>

  <rect x="72" y="134" width="336" height="42" rx="10" fill="#5b88b0"/>
  <text x="240" y="153" text-anchor="middle" font-size="12.5" fill="#ffffff">feature/x：从 dev 切出的 3 笔</text>
  <text x="240" y="170" text-anchor="middle" font-size="11.5" fill="#ffffff" fill-opacity="0.8">featA · featB · featC</text>

  <path d="M153,178 L153,208" stroke="#3a6491" stroke-width="2" marker-end="url(#edp-a)"/>
  <path d="M327,178 L327,208" stroke="#3a6491" stroke-width="2" marker-end="url(#edp-a)"/>

  <rect x="72" y="212" width="162" height="40" rx="9" fill="#eef5fa" stroke="#c3d6e6" stroke-width="1.4"/>
  <text x="153" y="230" text-anchor="middle" font-size="11.5" fill="#24476b">别人 merge 进去</text>
  <text x="153" y="246" text-anchor="middle" font-size="11.5" fill="#6b87a3">原 hash 保留</text>

  <rect x="246" y="212" width="162" height="40" rx="9" fill="#eef5fa" stroke="#c3d6e6" stroke-width="1.4"/>
  <text x="327" y="230" text-anchor="middle" font-size="11.5" fill="#24476b">我 cherry-pick 进去</text>
  <text x="327" y="246" text-anchor="middle" font-size="11.5" fill="#6b87a3">生成新 hash</text>

  <path d="M153,254 L153,284" stroke="#3a6491" stroke-width="2" marker-end="url(#edp-a)"/>
  <path d="M327,254 L327,284" stroke="#3a6491" stroke-width="2" marker-end="url(#edp-a)"/>
  <text x="240" y="273" text-anchor="middle" font-size="11.5" font-weight="700" fill="#b5544a">内容相同，hash 不同</text>

  <rect x="72" y="288" width="336" height="44" rx="10" fill="#24476b"/>
  <text x="240" y="307" text-anchor="middle" font-size="12.5" fill="#ffffff">develop：别人的 12 笔 + 这 3 笔的内容</text>
  <text x="240" y="324" text-anchor="middle" font-size="11.5" fill="#ffffff" fill-opacity="0.8">此时 develop 在内容上完整包含 feature/x</text>

  <!-- 右上左：git log -->
  <rect x="446" y="96" width="342" height="116" rx="12" fill="#ffffff" stroke="#b5544a" stroke-width="2"/>
  <rect x="718" y="108" width="52" height="22" rx="11" fill="#b5544a"/>
  <text x="744" y="123.5" text-anchor="middle" font-size="11.5" fill="#ffffff">判错</text>
  <text x="468" y="124" font-size="11.5" font-family="monospace" fill="#24476b">git log develop..feature/x</text>
  <text x="468" y="146" font-size="11.5" font-family="monospace" fill="#b5544a">e65f760 featC / 3a867bb featB / 4eaee08 featA</text>
  <text x="468" y="169" font-size="12.5" font-weight="700" fill="#b5544a">说缺 3 笔</text>
  <text x="468" y="190" font-size="11.5" fill="#6b87a3">按 hash 算范围，cherry-pick 后 hash 全变了</text>

  <!-- 右上右：branch contains -->
  <rect x="808" y="96" width="342" height="116" rx="12" fill="#ffffff" stroke="#b5544a" stroke-width="2"/>
  <rect x="1080" y="108" width="52" height="22" rx="11" fill="#b5544a"/>
  <text x="1106" y="123.5" text-anchor="middle" font-size="11.5" fill="#ffffff">判错</text>
  <text x="830" y="124" font-size="11.5" font-family="monospace" fill="#24476b">git branch --contains feature/x</text>
  <text x="830" y="146" font-size="11.5" fill="#b5544a">只列出 feature/x 自己</text>
  <text x="830" y="169" font-size="12.5" font-weight="700" fill="#b5544a">同样说「主干缺」</text>
  <text x="830" y="190" font-size="11.5" fill="#6b87a3">merge 和 cherry-pick 两条路都会让它永远误判</text>

  <!-- 右下左：diff stat -->
  <rect x="446" y="224" width="342" height="116" rx="12" fill="#ffffff" stroke="#b5544a" stroke-width="2"/>
  <rect x="718" y="236" width="52" height="22" rx="11" fill="#b5544a"/>
  <text x="744" y="251.5" text-anchor="middle" font-size="11.5" fill="#ffffff">判错</text>
  <text x="468" y="252" font-size="11.5" font-family="monospace" fill="#24476b">git diff develop..feature/x --stat</text>
  <text x="468" y="274" font-size="11.5" font-family="monospace" fill="#b5544a">12 files changed, 12 deletions(-)</text>
  <path d="M474,296 L482,296 L478,286 z" fill="#b5544a"/>
  <text x="490" y="297" font-size="12.5" font-weight="700" fill="#b5544a">方向反了：这 12 个在 develop 一侧</text>
  <text x="468" y="318" font-size="11.5" fill="#6b87a3">两点 diff 比两端快照，左边多的算 deletion</text>

  <!-- 右下右：git cherry -->
  <rect x="808" y="224" width="342" height="116" rx="12" fill="#eef5fa" stroke="#24476b" stroke-width="2"/>
  <rect x="1080" y="236" width="52" height="22" rx="11" fill="#24476b"/>
  <text x="1106" y="251.5" text-anchor="middle" font-size="11.5" fill="#ffffff">判对</text>
  <text x="830" y="252" font-size="11.5" font-family="monospace" fill="#24476b">git cherry develop feature/x</text>
  <text x="830" y="274" font-size="11.5" font-family="monospace" fill="#3a6491">- 4eaee08 / - 3a867bb / - e65f760</text>
  <text x="830" y="297" font-size="12.5" font-weight="700" fill="#24476b">全是 - ：内容已在 develop 里</text>
  <text x="830" y="318" font-size="11.5" fill="#6b87a3">按 patch-id 比对，换了父提交也认得出</text>

  <!-- 中：cherry 的天花板 -->
  <rect x="50" y="360" width="1100" height="132" rx="14" fill="#ffffff" stroke="#b5544a" stroke-width="2"/>
  <text x="76" y="386" font-size="15" font-weight="700" fill="#b5544a">cherry 的天花板：patch-id 对上下文敏感，错的那一面是静默的</text>

  <rect x="76" y="400" width="190" height="56" rx="10" fill="#eef5fa" stroke="#c3d6e6" stroke-width="1.4"/>
  <text x="171" y="421" text-anchor="middle" font-size="11.5" fill="#24476b">develop 上别人独立</text>
  <text x="171" y="439" text-anchor="middle" font-size="11.5" fill="#24476b">写了同一个 retry 函数</text>

  <path d="M266,428 L300,428" stroke="#3a6491" stroke-width="2" marker-end="url(#edp-a)"/>

  <rect x="303" y="400" width="160" height="56" rx="10" fill="#f6ebe9" stroke="#b5544a" stroke-width="1.4"/>
  <text x="383" y="421" text-anchor="middle" font-size="11.5" fill="#8c4a42">周围上下文一变</text>
  <text x="383" y="439" text-anchor="middle" font-size="11.5" fill="#8c4a42">patch-id 跟着变</text>

  <path d="M463,428 L497,428" stroke="#b5544a" stroke-width="2" marker-end="url(#edp-r)"/>

  <rect x="500" y="400" width="190" height="56" rx="10" fill="#b5544a"/>
  <text x="595" y="421" text-anchor="middle" font-size="11.5" fill="#ffffff">cherry 翻成 +，说缺这笔</text>
  <text x="595" y="440" text-anchor="middle" font-size="11.5" font-family="monospace" fill="#ffffff" fill-opacity="0.82">+ 610ea06...</text>

  <path d="M690,428 L724,428" stroke="#b5544a" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#edp-r)"/>

  <rect x="727" y="400" width="184" height="56" rx="10" fill="#8c4a42"/>
  <text x="819" y="421" text-anchor="middle" font-size="11.5" fill="#ffffff">照它去 pick：不报错</text>
  <text x="819" y="440" text-anchor="middle" font-size="11.5" fill="#ffffff" fill-opacity="0.82">也没有冲突和警告</text>

  <path d="M911,428 L945,428" stroke="#b5544a" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#edp-r)"/>

  <rect x="948" y="400" width="176" height="56" rx="10" fill="#f6ebe9" stroke="#8c4a42" stroke-width="1.6"/>
  <text x="1036" y="421" text-anchor="middle" font-size="12" font-weight="700" fill="#8c4a42">同一个 def retry</text>
  <text x="1036" y="440" text-anchor="middle" font-size="11.5" fill="#8c4a42">在文件里出现 2 次</text>

  <text x="76" y="478" font-size="11.5" fill="#6b87a3">所以 cherry 的输出只能当筛选：- 可信，+ 要逐个看。更快的办法是拿新函数名去目标分支搜 —— <tspan font-family="monospace" fill="#3a6491">git grep -c "def retry" develop</tspan> 返回 1，搜得到就说明合过了</text>

  <!-- 底部结论 -->
  <rect x="50" y="512" width="1100" height="116" rx="12" fill="#24476b"/>
  <text x="600" y="538" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">唯一的证据：合完之后重新比一次</text>

  <rect x="90" y="552" width="146" height="28" rx="8" fill="#ffffff" fill-opacity="0.16"/>
  <text x="163" y="571" text-anchor="middle" font-size="12" fill="#ffffff">dev（合并之后）</text>
  <rect x="90" y="586" width="146" height="28" rx="8" fill="#ffffff" fill-opacity="0.16"/>
  <text x="163" y="605" text-anchor="middle" font-size="12" fill="#ffffff">f2 / f3 / f4</text>

  <path d="M240,566 L290,574" stroke="#ffffff" stroke-width="1.8" marker-end="url(#edp-w)"/>
  <path d="M240,600 L290,590" stroke="#ffffff" stroke-width="1.8" marker-end="url(#edp-w)"/>

  <rect x="294" y="550" width="300" height="64" rx="10" fill="#ffffff"/>
  <text x="444" y="576" text-anchor="middle" font-size="13" font-weight="700" fill="#24476b">只数 insertion，全 0 = 没漏</text>
  <text x="444" y="596" text-anchor="middle" font-size="11.5" font-family="monospace" fill="#3a6491">git diff dev..&lt;branch&gt; --numstat</text>

  <text x="618" y="568" font-size="12" fill="#ffffff" fill-opacity="0.82">
    <tspan x="618">不看历史，只比两端文件内容；hash 和 patch-id 变没变都不影响</tspan>
    <tspan x="618" dy="19">原来写的「必须空 diff」在三分支时不成立：别的分支的文件会算成 deletion</tspan>
    <tspan x="618" dy="19">f3 上漏一笔，它立刻报 f3 → 1，并指出是 missed.txt；代价是一分钟</tspan>
  </text>
</svg>
