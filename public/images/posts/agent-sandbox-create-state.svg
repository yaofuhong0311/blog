<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img" aria-labelledby="title desc">
  <title id="title">创建操作、Sandbox 生命周期与三类时间约束</title>
  <desc id="desc">上半部分分别展示创建操作和 Sandbox 生命周期，下半部分展示创建超时、生命周期 TTL 与命令超时的覆盖范围。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#6b9cf4"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#315b91" flood-opacity=".08"/>
    </filter>
    <style>
      .title { font: 700 34px Inter, "Noto Sans SC", sans-serif; fill: #172033; }
      .subtitle { font: 400 17px Inter, "Noto Sans SC", sans-serif; fill: #67738a; }
      .section { font: 700 19px Inter, "Noto Sans SC", sans-serif; fill: #356bb8; letter-spacing: 1px; }
      .state { font: 700 17px Inter, "Noto Sans SC", sans-serif; fill: #172033; }
      .body { font: 400 15px Inter, "Noto Sans SC", sans-serif; fill: #566176; }
      .clock { font: 700 16px Inter, "Noto Sans SC", sans-serif; fill: #ffffff; }
      .note { font: 400 14px Inter, "Noto Sans SC", sans-serif; fill: #6c778c; }
    </style>
  </defs>

  <rect width="1200" height="780" rx="28" fill="#f2f6fa"/>
  <text x="62" y="68" class="title">两套状态机，三类时间约束</text>
  <text x="62" y="100" class="subtitle">创建操作在成功后结束，Sandbox 资源仍继续运行</text>

  <text x="62" y="152" class="section">CREATION OPERATION</text>
  <g filter="url(#shadow)">
    <rect x="62" y="174" width="180" height="82" rx="18" fill="#ffffff"/>
    <rect x="310" y="174" width="180" height="82" rx="18" fill="#ffffff"/>
    <rect x="558" y="174" width="180" height="82" rx="18" fill="#dce9ff"/>
    <rect x="806" y="174" width="150" height="82" rx="18" fill="#fff1e6"/>
    <rect x="988" y="174" width="150" height="82" rx="18" fill="#edf0f5"/>
  </g>
  <text x="113" y="224" class="state">QUEUED</text>
  <text x="350" y="224" class="state">CREATING</text>
  <text x="592" y="224" class="state">SUCCEEDED</text>
  <text x="844" y="224" class="state">FAILED</text>
  <text x="1011" y="224" class="state">CANCELLED</text>
  <line x1="242" y1="215" x2="300" y2="215" stroke="#6b9cf4" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="490" y1="215" x2="548" y2="215" stroke="#6b9cf4" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M490 235 C610 300, 730 300, 797 235" fill="none" stroke="#e49a5b" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="572" y="299" class="note">创建失败不会自动证明资源不存在</text>

  <text x="62" y="350" class="section">SANDBOX LIFECYCLE</text>
  <g filter="url(#shadow)">
    <rect x="62" y="372" width="180" height="82" rx="18" fill="#ffffff"/>
    <rect x="286" y="372" width="180" height="82" rx="18" fill="#ffffff"/>
    <rect x="510" y="372" width="180" height="82" rx="18" fill="#dce9ff"/>
    <rect x="734" y="372" width="180" height="82" rx="18" fill="#ffffff"/>
    <rect x="958" y="372" width="180" height="82" rx="18" fill="#edf0f5"/>
  </g>
  <text x="109" y="422" class="state">Pending</text>
  <text x="329" y="422" class="state">Running</text>
  <text x="571" y="422" class="state">Ready</text>
  <text x="775" y="422" class="state">Stopping</text>
  <text x="989" y="422" class="state">Terminated</text>
  <line x1="242" y1="413" x2="276" y2="413" stroke="#6b9cf4" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="466" y1="413" x2="500" y2="413" stroke="#6b9cf4" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="690" y1="413" x2="724" y2="413" stroke="#6b9cf4" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="914" y1="413" x2="948" y2="413" stroke="#6b9cf4" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M650 256 V337 H600 V363" fill="none" stroke="#6b9cf4" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="674" y="321" class="note">操作结束，资源继续存在</text>

  <text x="62" y="518" class="section">THREE CLOCKS</text>

  <rect x="62" y="546" width="310" height="58" rx="14" fill="#4f80cf"/>
  <text x="90" y="582" class="clock">Provision Timeout · 创建阶段</text>
  <line x1="372" y1="575" x2="510" y2="575" stroke="#9eb8df" stroke-width="4"/>

  <rect x="62" y="626" width="850" height="58" rx="14" fill="#356bb8"/>
  <text x="90" y="662" class="clock">Lease TTL · 从创建时刻覆盖整个 Sandbox 生命周期</text>
  <line x1="912" y1="655" x2="1138" y2="655" stroke="#9eb8df" stroke-width="4"/>

  <rect x="510" y="706" width="300" height="48" rx="14" fill="#78a2e5"/>
  <text x="540" y="737" class="clock">Command Timeout · 单次 exec</text>

  <line x1="62" y1="530" x2="1138" y2="530" stroke="#d6dfeb" stroke-width="1.5"/>
  <text x="1004" y="582" class="note">Ready 后可能执行多次命令</text>
</svg>
