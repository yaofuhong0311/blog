<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">
  <rect width="1200" height="600" rx="20" fill="#f2f6fa"/>

  <text x="600" y="44" text-anchor="middle" font-size="21" font-weight="700" fill="#24476b">同一份报告里的 21% 和 3%，只有一个能用</text>
  <text x="600" y="72" text-anchor="middle" font-size="14" fill="#6b87a3">差别不在数字大小，在于先量过这台机器自己抖多少</text>

  <!-- 噪声底 -->
  <rect x="50" y="100" width="1100" height="40" rx="9" fill="#f6ebe9"/>
  <text x="600" y="126" text-anchor="middle" font-size="13" font-weight="700" fill="#8c4a42">噪声底：etcd 写盘常停顿 5–12 秒，最长一次 18.9 秒。被测量级是几十秒，噪声占 10%–20%</text>

  <!-- 两组对照 -->
  <rect x="50" y="156" width="540" height="240" rx="14" fill="#ffffff" stroke="#b5544a" stroke-width="2"/>
  <text x="320" y="182" text-anchor="middle" font-size="15" font-weight="700" fill="#b5544a">差 3% —— 落在噪声里</text>
  <text x="120" y="216" font-size="12" fill="#24476b">经引擎</text>
  <rect x="190" y="202" width="326" height="26" rx="5" fill="#5b88b0"/>
  <text x="353" y="220" text-anchor="middle" font-size="12" fill="#ffffff">21.7 秒</text>
  <text x="120" y="252" font-size="12" fill="#24476b">直接建</text>
  <rect x="190" y="238" width="317" height="26" rx="5" fill="#5b88b0"/>
  <text x="348" y="256" text-anchor="middle" font-size="12" fill="#ffffff">21.1 秒</text>
  <rect x="507" y="202" width="9" height="62" fill="#b5544a" opacity="0.35"/>
  <text x="320" y="294" text-anchor="middle" font-size="12.5" fill="#8c4a42">这点差距比机器自己的抖动还小，而且每边只跑了 1 次</text>
  <rect x="86" y="308" width="468" height="70" rx="9" fill="#f6ebe9"/>
  <text x="320" y="330" text-anchor="middle" font-size="12.5" font-weight="700" fill="#8c4a42">只能写「没测出差异」</text>
  <text x="320" y="352" text-anchor="middle" font-size="11.5" fill="#8c4a42">
    <tspan x="320">写成「慢 3%，在容忍范围内」就给了读者一个我手里没有的数</tspan>
    <tspan x="320" dy="18">下次有人拿去算 3% 的累积影响，他算的是噪声</tspan>
  </text>

  <rect x="610" y="156" width="540" height="240" rx="14" fill="#ffffff" stroke="#24476b" stroke-width="2.5"/>
  <text x="880" y="182" text-anchor="middle" font-size="15" font-weight="700" fill="#24476b">差 21% —— 高出噪声</text>
  <text x="680" y="216" font-size="12" fill="#24476b">预拉镜像</text>
  <rect x="756" y="202" width="258" height="26" rx="5" fill="#24476b"/>
  <text x="885" y="220" text-anchor="middle" font-size="12" fill="#ffffff">44.3 秒</text>
  <text x="680" y="252" font-size="12" fill="#24476b">现场拉</text>
  <rect x="756" y="238" width="326" height="26" rx="5" fill="#5b88b0"/>
  <text x="919" y="256" text-anchor="middle" font-size="12" fill="#ffffff">56.0 秒</text>
  <rect x="1014" y="202" width="68" height="62" fill="#24476b" opacity="0.25"/>
  <text x="880" y="294" text-anchor="middle" font-size="12.5" fill="#3a6491">21% 刚够出头，方向和机制也对得上</text>
  <rect x="646" y="308" width="468" height="70" rx="9" fill="#eef5fa"/>
  <text x="880" y="330" text-anchor="middle" font-size="12.5" font-weight="700" fill="#24476b">这条当结论用了</text>
  <text x="880" y="352" text-anchor="middle" font-size="11.5" fill="#6b87a3">
    <tspan x="880">同一份报告里的数字要逐条划线</tspan>
    <tspan x="880" dy="18">不能整体表态说「这批数据可信」</tspan>
  </text>

  <!-- n=1 还能用的地方 -->
  <rect x="50" y="412" width="1100" height="76" rx="12" fill="#ffffff" stroke="#c3d6e6" stroke-width="1.5"/>
  <text x="600" y="436" text-anchor="middle" font-size="13.5" font-weight="700" fill="#3a6491">n=1 的数不是废数，降一档用法就行</text>
  <text x="600" y="458" text-anchor="middle" font-size="12" fill="#6b87a3">
    <tspan x="600">限速减半、时间几乎严格翻倍（69.17 → 141.55 秒）：翻倍比噪声大得多，两边又跑在同一台机器上</tspan>
    <tspan x="600" dy="19">加 CPU 时间完全没变：阴性结果反而更可靠，它是定性的，不需要精度</tspan>
  </text>

  <rect x="50" y="504" width="1100" height="66" rx="12" fill="#24476b"/>
  <text x="600" y="530" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">比值和机制能带走，绝对数带不走</text>
  <text x="600" y="554" text-anchor="middle" font-size="12.5" fill="#a9c4dc">「每秒建 263 个 Pod」产自一台抖着的 8 核机器和 50 台假节点，不能拿去给生产承诺容量</text>
</svg>
