<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">
  <rect width="1200" height="660" rx="20" fill="#f2f6fa"/>
  <text x="600" y="44" text-anchor="middle" font-size="21" font-weight="700" fill="#24476b">一个性能数字的三道检查</text>
  <text x="600" y="72" text-anchor="middle" font-size="14" fill="#6b87a3">机器抖多少、这组跑了几次、这个数在什么条件下成立——缺一样就只能当参考</text>

  <!-- ===== 左栏：噪声底 ===== -->
  <rect x="50" y="100" width="352" height="442" rx="14" fill="#ffffff" stroke="#c3d6e6" stroke-width="1.5"/>
  <text x="226" y="130" text-anchor="middle" font-size="16" font-weight="700" fill="#24476b">噪声底</text>
  <text x="226" y="150" text-anchor="middle" font-size="11.5" fill="#6b87a3">先量机器自己抖多少，再看差值</text>

  <text x="226" y="178" text-anchor="middle" font-size="12" fill="#24476b">etcd 写盘停顿 5–12 秒，最长一次 18.9 秒</text>
  <line x1="74" y1="188" x2="378" y2="188" stroke="#6b87a3" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="226" y="206" text-anchor="middle" font-size="11.5" fill="#6b87a3">噪声占被测时间的 10%–20%</text>

  <!-- 两组对照 -->
  <text x="135" y="230" text-anchor="middle" font-size="12" font-weight="700" fill="#6b87a3">60 个沙箱就绪</text>
  <text x="291" y="230" text-anchor="middle" font-size="12" font-weight="700" fill="#24476b">镜像预拉 vs 现场拉</text>

  <line x1="74" y1="392" x2="378" y2="392" stroke="#c3d6e6" stroke-width="1.5"/>

  <rect x="98" y="345" width="32" height="47" rx="4" fill="#5b88b0"/>
  <rect x="140" y="347" width="32" height="45" rx="4" fill="#5b88b0"/>
  <text x="114" y="363" text-anchor="middle" font-size="10.5" fill="#ffffff">21.7</text>
  <text x="156" y="365" text-anchor="middle" font-size="10.5" fill="#ffffff">21.1</text>
  <rect x="90" y="334" width="92" height="24" rx="4" fill="#6b87a3" fill-opacity="0.3" stroke="#6b87a3" stroke-width="1.2" stroke-dasharray="4 3"/>

  <rect x="254" y="297" width="32" height="95" rx="4" fill="#5b88b0"/>
  <rect x="296" y="272" width="32" height="120" rx="4" fill="#24476b"/>
  <text x="270" y="315" text-anchor="middle" font-size="10.5" fill="#ffffff">44.3</text>
  <text x="312" y="290" text-anchor="middle" font-size="10.5" fill="#ffffff">56.0</text>
  <line x1="286" y1="297" x2="348" y2="297" stroke="#24476b" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="328" y1="272" x2="348" y2="272" stroke="#24476b" stroke-width="1" stroke-dasharray="3 3"/>
  <rect x="336" y="272" width="12" height="25" fill="#24476b"/>

  <text x="114" y="406" text-anchor="middle" font-size="10" fill="#6b87a3">经引擎</text>
  <text x="156" y="406" text-anchor="middle" font-size="10" fill="#6b87a3">直接建</text>
  <text x="270" y="406" text-anchor="middle" font-size="10" fill="#6b87a3">预拉</text>
  <text x="312" y="406" text-anchor="middle" font-size="10" fill="#6b87a3">现场拉</text>

  <text x="135" y="430" text-anchor="middle" font-size="11.5" fill="#6b87a3">
    <tspan x="135">差 3%，落在噪声内</tspan>
    <tspan x="135" dy="19" font-weight="700">→ 没测出差异</tspan>
  </text>
  <text x="291" y="430" text-anchor="middle" font-size="11.5" fill="#24476b">
    <tspan x="291">差 21%，高出噪声</tspan>
    <tspan x="291" dy="19" font-weight="700">→ 可作结论</tspan>
  </text>

  <line x1="74" y1="470" x2="378" y2="470" stroke="#c3d6e6" stroke-width="1"/>
  <text x="226" y="492" text-anchor="middle" font-size="12" font-weight="700" fill="#24476b">判据在测之前写死</text>
  <text x="226" y="511" text-anchor="middle" font-size="11.5" fill="#6b87a3">慢不到 10% 就不动架构</text>

  <!-- ===== 中栏：样本量 ===== -->
  <rect x="424" y="100" width="352" height="442" rx="14" fill="#ffffff" stroke="#c3d6e6" stroke-width="1.5"/>
  <text x="600" y="130" text-anchor="middle" font-size="16" font-weight="700" fill="#24476b">样本量</text>
  <text x="600" y="150" text-anchor="middle" font-size="11.5" fill="#6b87a3">只跑一次的数不是不能用，是要降一档</text>

  <rect x="448" y="168" width="304" height="104" rx="10" fill="#f6ebe9" stroke="#b5544a" stroke-width="1.5"/>
  <text x="600" y="192" text-anchor="middle" font-size="13" font-weight="700" fill="#b5544a">n = 1，每边只跑一次</text>
  <line x1="476" y1="228" x2="724" y2="228" stroke="#c3d6e6" stroke-width="1"/>
  <circle cx="600" cy="228" r="6" fill="#b5544a"/>
  <path d="M570,228 L594,228" stroke="#b5544a" stroke-width="1.4" stroke-dasharray="3 3"/>
  <path d="M606,228 L630,228" stroke="#b5544a" stroke-width="1.4" stroke-dasharray="3 3"/>
  <text x="600" y="258" text-anchor="middle" font-size="11.5" fill="#8c4a42">噪声和差值同量级，一次停顿就能换位 → 做不出判定</text>

  <text x="600" y="302" text-anchor="middle" font-size="12.5" font-weight="700" fill="#24476b">同一组数据，降级怎么用</text>

  <rect x="448" y="316" width="304" height="100" rx="10" fill="#eef5fa" stroke="#5b88b0" stroke-width="1.6"/>
  <path d="M466,350 L474,360 L490,338" fill="none" stroke="#24476b" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="502" y="344" font-size="12.5" font-weight="700" fill="#24476b">带得走：同环境比值</text>
  <text x="470" y="374" font-size="11.5" fill="#3a6491">
    <tspan x="470">限速 <tspan font-family="monospace">100/秒 → 50/秒</tspan></tspan>
    <tspan x="470" dy="19"><tspan font-family="monospace">69.17 秒 → 141.55 秒</tspan>，几乎严格翻倍</tspan>
  </text>

  <rect x="448" y="428" width="304" height="84" rx="10" fill="#f6ebe9" stroke="#b5544a" stroke-width="1.6"/>
  <line x1="466" y1="446" x2="484" y2="464" stroke="#b5544a" stroke-width="2.6" stroke-linecap="round"/>
  <line x1="484" y1="446" x2="466" y2="464" stroke="#b5544a" stroke-width="2.6" stroke-linecap="round"/>
  <text x="498" y="461" font-size="12.5" font-weight="700" fill="#b5544a">带不走：绝对数</text>
  <text x="470" y="489" font-size="11.5" fill="#8c4a42">
    <tspan x="470">实测<tspan font-family="monospace"> 每秒 263 个 pod</tspan>，产自一台抖着的</tspan>
    <tspan x="470" dy="18">8 核机器和 50 台假节点，不能承诺生产容量</tspan>
  </text>

  <!-- ===== 右栏：适用边界 ===== -->
  <rect x="798" y="100" width="352" height="442" rx="14" fill="#ffffff" stroke="#c3d6e6" stroke-width="1.5"/>
  <text x="974" y="130" text-anchor="middle" font-size="16" font-weight="700" fill="#24476b">适用边界</text>
  <text x="974" y="150" text-anchor="middle" font-size="11.5" fill="#6b87a3">50 台模拟节点，线画在 kubelet 汇报那一层</text>

  <text x="822" y="180" font-size="12.5" font-weight="700" fill="#24476b">线以上：真的，结论能带走</text>
  <rect x="822" y="190" width="304" height="124" rx="10" fill="#eef5fa" stroke="#5b88b0" stroke-width="1.4"/>
  <text x="844" y="214" font-size="11.5" fill="#3a6491">
    <tspan x="844">· 调度器怎么选节点</tspan>
    <tspan x="844" dy="20">· watch 事件的量</tspan>
    <tspan x="844" dy="20">· 控制器回写状态的次数</tspan>
    <tspan x="844" dy="20">· 客户端限速（<tspan font-family="monospace">每秒 100 次</tspan>）</tspan>
    <tspan x="844" dy="20">· 控制器 CPU 被限流</tspan>
  </text>

  <line x1="810" y1="330" x2="1138" y2="330" stroke="#3a6491" stroke-width="2.5"/>
  <rect x="876" y="318" width="196" height="24" rx="6" fill="#24476b"/>
  <text x="974" y="335" text-anchor="middle" font-size="11.5" font-weight="700" fill="#ffffff">kubelet 汇报层 ← 线画在这</text>

  <text x="822" y="372" font-size="12.5" font-weight="700" fill="#b5544a">线以下：伪造的，数字不算数</text>
  <rect x="822" y="382" width="304" height="68" rx="10" fill="#f6ebe9" stroke="#b5544a" stroke-width="1.4"/>
  <text x="844" y="406" font-size="11.5" fill="#8c4a42">
    <tspan x="844">· 镜像下载</tspan>
    <tspan x="844" dy="20">· 容器启动　· CPU 争抢</tspan>
  </text>

  <line x1="822" y1="468" x2="1126" y2="468" stroke="#c3d6e6" stroke-width="1"/>
  <text x="974" y="489" text-anchor="middle" font-size="12" font-weight="700" fill="#24476b">边界还带规模：瓶颈会换位置</text>
  <text x="974" y="509" text-anchor="middle" font-size="11.5" fill="#6b87a3">
    <tspan x="974">60 个卡在 init 容器资源记账，</tspan>
    <tspan x="974" dy="18">1000 个才换成每秒 100 次的 API 限速</tspan>
  </text>

  <!-- ===== 底部结论带 ===== -->
  <rect x="50" y="566" width="1100" height="74" rx="12" fill="#24476b"/>
  <text x="600" y="590" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">没测成和测出不行是两回事，对应三个不同的后续动作</text>

  <line x1="416" y1="602" x2="416" y2="630" stroke="#5b88b0" stroke-width="1.2"/>
  <line x1="784" y1="602" x2="784" y2="630" stroke="#5b88b0" stroke-width="1.2"/>

  <text x="233" y="616" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">未复现</text>
  <text x="233" y="633" text-anchor="middle" font-size="11.5" fill="#a9c4dc">留根因和适用边界</text>

  <text x="600" y="616" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">没测成</text>
  <text x="600" y="633" text-anchor="middle" font-size="11.5" fill="#a9c4dc">留复测条件</text>

  <text x="967" y="616" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">测出不行</text>
  <text x="967" y="633" text-anchor="middle" font-size="11.5" fill="#a9c4dc">才能把一个方向关掉</text>
</svg>
