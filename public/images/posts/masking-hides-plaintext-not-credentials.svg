<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">
  <rect width="1200" height="680" rx="20" fill="#f2f6fa"/>

  <text x="600" y="44" text-anchor="middle" font-size="21" font-weight="700" fill="#24476b">同一份提交，三种写回策略</text>
  <text x="600" y="70" text-anchor="middle" font-size="14" fill="#6b87a3">差别不在用户提交了什么，在服务端拿到占位符那一下替他做了什么决定</text>

  <!-- 三栏共用的输入 -->
  <rect x="50" y="82" width="1100" height="78" rx="14" fill="#ffffff" stroke="#c3d6e6" stroke-width="1.6"/>
  <text x="76" y="106" font-size="13" font-weight="700" fill="#24476b">三栏共用的输入：前端把脱敏后的出参原样填回表单，再整份提交回来</text>
  <text x="76" y="132" font-size="12.5" font-family="monospace" fill="#24476b">{name: "改过了", url: "https://attacker.example", headers: {"Authorization": "******"}}</text>
  <text x="76" y="152" font-size="11.5" fill="#6b87a3">用户看到的 Authorization 一直是 6 个星号</text>

  <!-- 第 1 栏：直接写入 -->
  <rect x="50" y="172" width="352" height="424" rx="14" fill="#ffffff" stroke="#d8c2bf" stroke-width="2"/>
  <rect x="64" y="180" width="24" height="22" rx="6" fill="#b5544a"/>
  <text x="76" y="196" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">1</text>
  <text x="96" y="196" font-size="14.5" font-weight="700" fill="#b5544a">直接写入（出事的版本）</text>

  <text x="76" y="228" font-size="11" fill="#6b87a3">服务端做了什么</text>
  <rect x="62" y="236" width="328" height="80" rx="10" fill="#eef5fa"/>
  <text x="76" y="258" font-size="12" fill="#24476b">不区分占位符和用户输入</text>
  <text x="76" y="277" font-size="12" fill="#24476b">提交体里是什么，就往库里写什么</text>
  <text x="76" y="298" font-size="11" fill="#6b87a3">从出参到入库，中间没有一步会拦下它</text>

  <text x="76" y="332" font-size="11" fill="#6b87a3">落库值（DB 里实际存的）</text>
  <rect x="62" y="340" width="328" height="54" rx="10" fill="#f6ebe9" stroke="#d8c2bf" stroke-width="1.4"/>
  <text x="76" y="362" font-size="12.5" font-family="monospace" fill="#8c4a42">Authorization: ******</text>
  <text x="76" y="382" font-size="10.5" fill="#8c4a42">字面量 6 个星号，真 token 被覆盖掉了</text>

  <text x="76" y="414" font-size="11" fill="#6b87a3">沙箱发出去的</text>
  <rect x="62" y="422" width="328" height="46" rx="10" fill="#ffffff" stroke="#d8c2bf" stroke-width="1.4"/>
  <text x="76" y="440" font-size="11.5" fill="#24476b">带 <tspan font-family="monospace">******</tspan> 去请求第三方</text>
  <text x="76" y="458" font-size="11.5" font-weight="700" fill="#b5544a">第三方 401</text>

  <rect x="62" y="476" width="328" height="54" rx="10" fill="#b5544a"/>
  <text x="76" y="497" font-size="12.5" font-weight="700" fill="#ffffff"><tspan font-size="11" font-weight="400" fill="#f0d9d6">结局 · </tspan>配置报废，这个工具连不上</text>
  <text x="76" y="517" font-size="11" fill="#f0d9d6">而保存接口返回 200，调用方看不出异常</text>

  <line x1="62" y1="540" x2="390" y2="540" stroke="#d8c2bf" stroke-width="1"/>
  <text x="76" y="556" font-size="10.5" fill="#6b87a3">报障时怎么查出来的：</text>
  <text x="76" y="571" font-size="10.5" fill="#8c4a42">先怀疑上游挂了或 token 过期，这两种猜测要是成立，</text>
  <text x="76" y="586" font-size="10.5" fill="#8c4a42">库里存的都该是一个真 token</text>

  <!-- 第 2 栏：无条件还原 -->
  <rect x="424" y="172" width="352" height="424" rx="14" fill="#ffffff" stroke="#d8c2bf" stroke-width="2"/>
  <rect x="438" y="180" width="24" height="22" rx="6" fill="#8c4a42"/>
  <text x="450" y="196" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">2</text>
  <text x="470" y="196" font-size="14.5" font-weight="700" fill="#8c4a42">无条件还原</text>

  <text x="450" y="228" font-size="11" fill="#6b87a3">服务端做了什么</text>
  <rect x="436" y="236" width="328" height="80" rx="10" fill="#eef5fa"/>
  <text x="450" y="258" font-size="12" fill="#24476b">headers 按 key 逐个和库里比对</text>
  <text x="450" y="277" font-size="12" fill="#24476b">值等于占位符的，取库里原值</text>
  <text x="450" y="298" font-size="11" fill="#6b87a3">url 不是占位符，按提交里的新地址写入</text>

  <text x="450" y="332" font-size="11" fill="#6b87a3">落库值（DB 里实际存的）</text>
  <rect x="436" y="340" width="328" height="54" rx="10" fill="#f6ebe9" stroke="#d8c2bf" stroke-width="1.4"/>
  <text x="450" y="361" font-size="12" font-family="monospace" fill="#24476b">Authorization: Bearer ••••</text>
  <text x="450" y="381" font-size="11" font-family="monospace" fill="#b5544a">url: https://attacker.example</text>

  <text x="450" y="414" font-size="11" fill="#6b87a3">沙箱发出去的</text>
  <rect x="436" y="422" width="328" height="46" rx="10" fill="#ffffff" stroke="#d8c2bf" stroke-width="1.4"/>
  <text x="450" y="440" font-size="11.5" fill="#24476b">带真 token 请求 attacker.example</text>
  <text x="450" y="458" font-size="11.5" font-weight="700" fill="#8c4a42">凭证送达他自己的服务器</text>

  <rect x="436" y="476" width="328" height="54" rx="10" fill="#8c4a42"/>
  <text x="450" y="497" font-size="12.5" font-weight="700" fill="#ffffff"><tspan font-size="11" font-weight="400" fill="#f0d9d6">结局 · </tspan>改记录的人全程没见过明文</text>
  <text x="450" y="517" font-size="11" fill="#f0d9d6">真 token 是服务端替他填上去的，凭证到手</text>

  <line x1="436" y1="540" x2="764" y2="540" stroke="#d8c2bf" stroke-width="1"/>
  <text x="450" y="556" font-size="10.5" fill="#6b87a3">为什么够得着：</text>
  <text x="450" y="571" font-size="10.5" fill="#8c4a42">这个接口对任意登录用户开放，同组织成员可以改</text>
  <text x="450" y="586" font-size="10.5" fill="#8c4a42">别人建的记录（既有权限设计，本次没动）</text>

  <!-- 第 3 栏：还原 + 上游变更拒绝 -->
  <rect x="798" y="172" width="352" height="424" rx="14" fill="#ffffff" stroke="#24476b" stroke-width="2.5"/>
  <rect x="812" y="180" width="24" height="22" rx="6" fill="#24476b"/>
  <text x="824" y="196" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">3</text>
  <text x="844" y="196" font-size="14.5" font-weight="700" fill="#24476b">还原 + 上游变更拒绝（现版本）</text>

  <text x="824" y="228" font-size="11" fill="#6b87a3">服务端做了什么</text>
  <rect x="810" y="236" width="328" height="80" rx="10" fill="#eef5fa"/>
  <text x="824" y="254" font-size="11.5" fill="#24476b">还原之外，再看两个条件是否同时成立</text>
  <text x="824" y="272" font-size="11.5" fill="#3a6491">① 提交里仍含占位符</text>
  <text x="824" y="289" font-size="11.5" fill="#3a6491">② scheme / host / port 与库中不一致</text>
  <text x="824" y="307" font-size="11.5" font-weight="700" fill="#24476b">两条都成立 → 拒绝保存，要求重填凭证</text>

  <text x="824" y="332" font-size="11" fill="#6b87a3">落库值（DB 里实际存的）</text>
  <rect x="810" y="340" width="328" height="54" rx="10" fill="#eef5fa" stroke="#c3d6e6" stroke-width="1.4"/>
  <text x="824" y="361" font-size="12" font-family="monospace" fill="#24476b">Authorization: Bearer ••••</text>
  <text x="824" y="381" font-size="10.5" fill="#3a6491">原值不动，url 也仍是库里的旧地址</text>

  <text x="824" y="414" font-size="11" fill="#6b87a3">沙箱发出去的</text>
  <rect x="810" y="422" width="328" height="46" rx="10" fill="#ffffff" stroke="#c3d6e6" stroke-width="1.4"/>
  <text x="824" y="440" font-size="11.5" fill="#24476b">带真 token 请求原来的上游</text>
  <text x="824" y="458" font-size="11.5" font-weight="700" fill="#3a6491">这条记录一个字都没改</text>

  <rect x="810" y="476" width="328" height="54" rx="10" fill="#24476b"/>
  <text x="824" y="497" font-size="12.5" font-weight="700" fill="#ffffff"><tspan font-size="11" font-weight="400" fill="#a9c4dc">结局 · </tspan>真 token 不会被填到别人的地址上</text>
  <text x="824" y="517" font-size="11" fill="#a9c4dc">想换上游，就得把凭证重新填一遍</text>

  <!-- 第 3 栏的例外 -->
  <line x1="810" y1="540" x2="1138" y2="540" stroke="#c3d6e6" stroke-width="1"/>
  <text x="824" y="556" font-size="10.5" fill="#6b87a3">下面四种操作不受这条拒绝影响：</text>
  <text x="824" y="571" font-size="10.5" fill="#3a6491">改 path · 只改名 · 没有 url 的 internal 类型</text>
  <text x="824" y="586" font-size="10.5" fill="#3a6491">换上游的同时重填凭证（此时提交里没有占位符）</text>

  <rect x="50" y="608" width="1100" height="48" rx="12" fill="#24476b"/>
  <text x="600" y="630" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">星号只挡住了前端看到的明文，凭证还在库里</text>
  <text x="600" y="649" text-anchor="middle" font-size="12" fill="#a9c4dc">脱敏过的值一定会原样提交回来，换回真值只能服务端做；替提交的人填回真 token 之前，得先确认这次是填给谁</text>
</svg>
