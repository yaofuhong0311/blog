<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">
  <rect width="1200" height="600" rx="20" fill="#f2f6fa"/>
  <defs><marker id="ip" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#3a6491"/></marker></defs>

  <text x="600" y="44" text-anchor="middle" font-size="21" font-weight="700" fill="#24476b">逐项列表，而不是笼统说「要上 Redis」</text>
  <text x="600" y="72" text-anchor="middle" font-size="14" fill="#6b87a3">做完发现 Redis 根本不是前置条件——当初写进文档的那条结论被自己推翻了</text>

  <!-- 起点 -->
  <rect x="50" y="102" width="340" height="88" rx="12" fill="#f6ebe9" stroke="#b5544a" stroke-width="2"/>
  <text x="220" y="128" text-anchor="middle" font-size="14" font-weight="700" fill="#b5544a">副本从 2 降到 1</text>
  <text x="220" y="150" text-anchor="middle" font-size="12" fill="#8c4a42">
    <tspan x="220">幂等表、熔断计数、排队数都在内存里</tspan>
    <tspan x="220" dy="18">同键重试落到另一副本就再建一个沙箱</tspan>
  </text>
  <text x="220" y="182" text-anchor="middle" font-size="11.5" font-weight="700" fill="#b5544a">用可用性换正确性</text>

  <path d="M390,146 L430,146" stroke="#3a6491" stroke-width="2" marker-end="url(#ip)"/>

  <rect x="436" y="102" width="330" height="88" rx="12" fill="#eef5fa" stroke="#c3d6e6" stroke-width="1.5"/>
  <text x="601" y="128" text-anchor="middle" font-size="14" font-weight="700" fill="#3a6491">当时写进文档的结论</text>
  <text x="601" y="152" text-anchor="middle" font-size="12.5" fill="#6b87a3">「恢复多副本的前置是把这些</text>
  <text x="601" y="172" text-anchor="middle" font-size="12.5" fill="#6b87a3">状态挪到 Redis」</text>

  <path d="M766,146 L806,146" stroke="#3a6491" stroke-width="2" marker-end="url(#ip)"/>

  <rect x="812" y="102" width="338" height="88" rx="12" fill="#24476b"/>
  <text x="981" y="128" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">逐件搬完之后</text>
  <text x="981" y="152" text-anchor="middle" font-size="12.5" fill="#a9c4dc">Redis 不是前置条件</text>
  <text x="981" y="174" text-anchor="middle" font-size="11.5" fill="#ffffff">文档里保留旧表述并显式订正</text>

  <!-- 五项清单 -->
  <text x="600" y="228" text-anchor="middle" font-size="15" font-weight="700" fill="#3a6491">五项状态，逐项标注现状</text>

  <g font-size="12">
    <rect x="60" y="244" width="1080" height="46" rx="8" fill="#eef5fa"/>
    <text x="82" y="264" font-weight="700" fill="#24476b">建沙箱幂等</text>
    <text x="82" y="282" fill="#6b87a3">真源挪到沙箱自己的 metadata：创建时写摘要，占位表没命中就按 metadata 反查并认领</text>
    <text x="1060" y="273" text-anchor="end" font-size="12.5" font-weight="700" fill="#24476b">跨副本可用</text>

    <rect x="60" y="296" width="1080" height="46" rx="8" fill="#eef5fa"/>
    <text x="82" y="316" font-weight="700" fill="#24476b">资源归属定位</text>
    <text x="82" y="334" fill="#6b87a3">改读控制器写在 CRD 注解里的分配结果，代价是多一次读、可能一次全节点扫</text>
    <text x="1060" y="325" text-anchor="end" font-size="12.5" font-weight="700" fill="#24476b">跨副本可用</text>

    <rect x="60" y="348" width="1080" height="46" rx="8" fill="#ffffff" stroke="#c3d6e6" stroke-width="1.5"/>
    <text x="82" y="368" font-weight="700" fill="#3a6491">熔断 / 排队计数</text>
    <text x="82" y="386" fill="#6b87a3">多副本下各记各的，阈值实际翻倍——配一半可抵消</text>
    <text x="1060" y="377" text-anchor="end" font-size="12.5" font-weight="700" fill="#5b88b0">接受退化</text>

    <rect x="60" y="400" width="1080" height="46" rx="8" fill="#f6ebe9"/>
    <text x="82" y="420" font-weight="700" fill="#8c4a42">exec-jobs 幂等</text>
    <text x="82" y="438" fill="#8c4a42">仍是纯进程内，同键重试落到另一副本会把命令再执行一遍</text>
    <text x="1060" y="429" text-anchor="end" font-size="12.5" font-weight="700" fill="#b5544a">仍有缺口</text>

    <rect x="60" y="452" width="1080" height="46" rx="8" fill="#f6ebe9"/>
    <text x="82" y="472" font-weight="700" fill="#8c4a42">目录锁</text>
    <text x="82" y="490" fill="#8c4a42">只锁本进程</text>
    <text x="1060" y="481" text-anchor="end" font-size="12.5" font-weight="700" fill="#b5544a">仍有缺口</text>
  </g>

  <rect x="50" y="516" width="1100" height="64" rx="12" fill="#24476b"/>
  <text x="600" y="542" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">把真源写进被管理对象自身的元数据</text>
  <text x="600" y="564" text-anchor="middle" font-size="12" fill="#a9c4dc">这个思路在 Kubernetes 之外也成立：订单号写进下游单据、任务 id 写进产物</text>
</svg>
