<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="648" viewBox="0 0 1200 648" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">
  <rect width="1200" height="648" rx="20" fill="#f2f6fa"/>
  <defs>
    <marker id="iplr-a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#3a6491"/></marker>
    <marker id="iplr-r" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#b5544a"/></marker>
  </defs>

  <text x="600" y="44" text-anchor="middle" font-size="21" font-weight="700" fill="#24476b">五项进程内状态在多副本下的去处</text>
  <text x="600" y="72" text-anchor="middle" font-size="14" fill="#6b87a3">锁死副本数的不是缺一个外部存储，是没人把进程内状态逐件列出来过</text>

  <!-- 左区标题 -->
  <text x="48" y="100" font-size="13" font-weight="700" fill="#24476b">进程内存：两个副本各记各的，互不可见</text>
  <text x="1152" y="100" text-anchor="end" font-size="11.5" fill="#6b87a3">生产副本数从 2 降到 1，这些问题才全部消失</text>

  <!-- 副本 B：同形状、同五格，内容各记各的 -->
  <rect x="48" y="108" width="88" height="404" rx="12" fill="#ffffff" stroke="#c3d6e6" stroke-width="1.4" stroke-dasharray="6 5"/>
  <text x="92" y="130" text-anchor="middle" font-size="13" font-weight="700" fill="#8fa9c0">副本 B</text>
  <rect x="56" y="140" width="72" height="46" rx="7" fill="#f7fbfe" stroke="#c3d6e6" stroke-width="1.2" stroke-dasharray="4 4"/>
  <rect x="56" y="195" width="72" height="46" rx="7" fill="#f7fbfe" stroke="#c3d6e6" stroke-width="1.2" stroke-dasharray="4 4"/>
  <rect x="56" y="297" width="72" height="46" rx="7" fill="#f7fbfe" stroke="#c3d6e6" stroke-width="1.2" stroke-dasharray="4 4"/>
  <rect x="56" y="399" width="72" height="46" rx="7" fill="#f7fbfe" stroke="#c3d6e6" stroke-width="1.2" stroke-dasharray="4 4"/>
  <rect x="56" y="454" width="72" height="46" rx="7" fill="#f7fbfe" stroke="#c3d6e6" stroke-width="1.2" stroke-dasharray="4 4"/>

  <!-- 互不可见 -->
  <path d="M144,116 L144,504" stroke="#b5544a" stroke-width="1.6" stroke-dasharray="6 5"/>
  <rect x="135" y="260" width="18" height="18" fill="#f2f6fa"/>
  <line x1="138" y1="263" x2="150" y2="275" stroke="#b5544a" stroke-width="2.5"/>
  <line x1="150" y1="263" x2="138" y2="275" stroke="#b5544a" stroke-width="2.5"/>

  <!-- 副本 A：五项进程内状态 -->
  <rect x="152" y="108" width="190" height="404" rx="12" fill="#ffffff" stroke="#5b88b0" stroke-width="1.8"/>
  <text x="247" y="130" text-anchor="middle" font-size="13" font-weight="700" fill="#24476b">副本 A</text>

  <rect x="160" y="140" width="174" height="46" rx="8" fill="#eef5fa" stroke="#5b88b0" stroke-width="1.5"/>
  <text x="247" y="168" text-anchor="middle" font-size="13" fill="#24476b">建沙箱幂等表</text>

  <rect x="160" y="195" width="174" height="46" rx="8" fill="#eef5fa" stroke="#5b88b0" stroke-width="1.5"/>
  <text x="247" y="223" text-anchor="middle" font-size="13" fill="#24476b">工具沙箱 Pod 归属</text>

  <rect x="160" y="297" width="174" height="46" rx="8" fill="#eef5fa" stroke="#5b88b0" stroke-width="1.5"/>
  <text x="247" y="325" text-anchor="middle" font-size="13" fill="#24476b">调度熔断 / 排队计数</text>

  <rect x="160" y="399" width="174" height="46" rx="8" fill="#eef5fa" stroke="#5b88b0" stroke-width="1.5"/>
  <text x="247" y="427" text-anchor="middle" font-size="13" fill="#24476b"><tspan font-family="monospace">exec-jobs</tspan> 幂等表</text>

  <rect x="160" y="454" width="174" height="46" rx="8" fill="#eef5fa" stroke="#5b88b0" stroke-width="1.5"/>
  <text x="247" y="474" text-anchor="middle" font-size="12.5" fill="#24476b" font-family="monospace">agent-package</text>
  <text x="247" y="491" text-anchor="middle" font-size="12.5" fill="#24476b"><tspan font-family="monospace">git</tspan> 目录锁</text>

  <!-- 五条去处箭头 -->
  <path d="M346,163 L392,163" stroke="#3a6491" stroke-width="2" marker-end="url(#iplr-a)"/>
  <path d="M346,218 L392,218" stroke="#3a6491" stroke-width="2" marker-end="url(#iplr-a)"/>
  <path d="M346,320 L392,320" stroke="#3a6491" stroke-width="2" marker-end="url(#iplr-a)"/>
  <path d="M346,422 L392,422" stroke="#b5544a" stroke-width="2" marker-end="url(#iplr-r)"/>
  <path d="M346,477 L392,477" stroke="#b5544a" stroke-width="2" marker-end="url(#iplr-r)"/>

  <!-- 去处一：真源搬到被管理对象（实线框） -->
  <rect x="396" y="108" width="756" height="145" rx="14" fill="#ffffff" stroke="#24476b" stroke-width="2.5"/>
  <text x="412" y="130" font-size="14" font-weight="700" fill="#24476b">① 真源搬到被管理对象</text>
  <text x="1136" y="130" text-anchor="end" font-size="11.5" fill="#6b87a3">实线框 · 两件都没用到外部存储</text>

  <rect x="408" y="140" width="732" height="46" rx="8" fill="#eef5fa" stroke="#c3d6e6" stroke-width="1.2"/>
  <text x="424" y="159" font-size="13" fill="#24476b">写进沙箱自己的 <tspan font-family="monospace">metadata.idem</tspan> / <tspan font-family="monospace">metadata.idem_owner</tspan></text>
  <text x="424" y="177" font-size="11.5" fill="#6b87a3">摘要 = <tspan font-family="monospace">sha256(租户作用域 | Idempotency-Key)</tspan> 的前 32 位，占位表没命中就按摘要问引擎要</text>
  <rect x="1016" y="151" width="108" height="24" rx="12" fill="#24476b"/>
  <text x="1070" y="167" text-anchor="middle" font-size="11.5" fill="#ffffff">跨副本可读</text>

  <rect x="408" y="195" width="732" height="46" rx="8" fill="#eef5fa" stroke="#c3d6e6" stroke-width="1.2"/>
  <text x="424" y="214" font-size="13" fill="#24476b">改读控制器写在 CRD 注解里的分配结果</text>
  <text x="424" y="232" font-size="11.5" fill="#6b87a3">只读 k8s 客户端，Role 只有一条 <tspan font-family="monospace">get batchsandboxes</tspan>，不给 PVC / Pod / Secret</text>
  <rect x="1016" y="206" width="108" height="24" rx="12" fill="#24476b"/>
  <text x="1070" y="222" text-anchor="middle" font-size="11.5" fill="#ffffff">跨副本可读</text>

  <!-- 去处二：会退化（点划线框） -->
  <rect x="396" y="265" width="756" height="90" rx="14" fill="#ffffff" stroke="#5b88b0" stroke-width="2" stroke-dasharray="10 4 2 4"/>
  <text x="412" y="287" font-size="14" font-weight="700" fill="#3a6491">② 会退化，配一半可抵消</text>
  <text x="1136" y="287" text-anchor="end" font-size="11.5" fill="#6b87a3">点划线框 · 不阻塞扩副本</text>

  <rect x="408" y="297" width="732" height="46" rx="8" fill="#eef5fa" stroke="#c3d6e6" stroke-width="1.2"/>
  <text x="424" y="316" font-size="13" fill="#24476b">两个副本各数各的，阈值和上限实际翻倍</text>
  <text x="424" y="334" font-size="11.5" fill="#6b87a3">滑动窗口内 <tspan font-family="monospace">3</tspan> 次熔断 → 实际要 <tspan font-family="monospace">6</tspan> 次；排队上限 <tspan font-family="monospace">500</tspan> → 实际放进 <tspan font-family="monospace">1000</tspan></text>
  <rect x="1016" y="308" width="108" height="24" rx="12" fill="#5b88b0"/>
  <text x="1070" y="324" text-anchor="middle" font-size="11.5" fill="#ffffff">配一半可抵消</text>

  <!-- 去处三：仍有缺口（粗虚线框） -->
  <rect x="396" y="367" width="756" height="145" rx="14" fill="#ffffff" stroke="#b5544a" stroke-width="3" stroke-dasharray="8 6"/>
  <text x="412" y="389" font-size="14" font-weight="700" fill="#b5544a">③ 仍有缺口</text>
  <text x="1136" y="389" text-anchor="end" font-size="11.5" fill="#8c4a42">粗虚线框 · 两条都只是从代码读出来的，没实测过</text>

  <rect x="408" y="399" width="732" height="46" rx="8" fill="#f6ebe9" stroke="#d8c2bf" stroke-width="1.2"/>
  <text x="424" y="418" font-size="13" fill="#8c4a42">同键重试落到另一副本，命令会再执行一遍</text>
  <text x="424" y="436" font-size="11.5" fill="#8c4a42">命令执行不产出带 <tspan font-family="monospace">metadata</tspan> 的对象，摘要没地方挂，没有便宜解法</text>
  <rect x="1016" y="410" width="108" height="24" rx="12" fill="#b5544a"/>
  <text x="1070" y="426" text-anchor="middle" font-size="11.5" fill="#ffffff">仍是缺口</text>

  <rect x="408" y="454" width="732" height="46" rx="8" fill="#f6ebe9" stroke="#d8c2bf" stroke-width="1.2"/>
  <text x="424" y="473" font-size="13" fill="#8c4a42">锁只在本进程，两副本对同一目录并发提交会撞 <tspan font-family="monospace">index.lock</tspan></text>
  <text x="424" y="491" font-size="11.5" fill="#8c4a42"><tspan font-family="monospace">dict[Path, asyncio.Lock]</tspan>；撞上了记 warning，改动并进下一次提交</text>
  <rect x="1016" y="465" width="108" height="24" rx="12" fill="#b5544a"/>
  <text x="1070" y="481" text-anchor="middle" font-size="11.5" fill="#ffffff">仍是缺口</text>

  <text x="1152" y="526" text-anchor="end" font-size="11.5" fill="#6b87a3">生产副本数现在仍为 1，四个环境都是 1；要改，判据是逐条过这张表</text>

  <!-- 底部：被推翻的那句前置 -->
  <rect x="48" y="532" width="1104" height="92" rx="12" fill="#24476b"/>
  <line x1="414" y1="550" x2="426" y2="562" stroke="#b5544a" stroke-width="2.5"/>
  <line x1="426" y1="550" x2="414" y2="562" stroke="#b5544a" stroke-width="2.5"/>
  <text x="600" y="561" text-anchor="middle" font-size="14.5" fill="#9fbdd6">恢复多副本的前置 = 把这些状态挪到 Redis</text>
  <line x1="444" y1="556" x2="756" y2="556" stroke="#b5544a" stroke-width="2.2"/>
  <text x="600" y="585" text-anchor="middle" font-size="11.5" fill="#7fa4c4">2026-09-16 写进文档，09-17 搬完前两件就推翻；订正加在原处，没删掉</text>
  <text x="600" y="611" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">五项里两项已经不需要外部存储、一项改配置就能抵消，只剩两项是真缺口</text>
</svg>
