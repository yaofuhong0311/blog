<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">AgentScope Storage 的职责边界</title>
  <desc id="desc">ChatService 通过 StorageBase 将会话状态和消息快照分别写入 RedisStorage 或 SQLStorage。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#5b8def"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#26466d" flood-opacity=".10"/>
    </filter>
    <style>
      .title { font: 700 28px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #1f3349; }
      .label { font: 700 20px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #20354d; }
      .sub { font: 400 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #60758d; }
      .code { font: 600 15px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #42658b; }
      .small { font: 500 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #6e8298; }
    </style>
  </defs>

  <rect width="1200" height="680" rx="28" fill="#f2f6fa"/>
  <text x="600" y="54" text-anchor="middle" class="title">AgentScope Storage：业务语义与存储实现分离</text>

  <g filter="url(#shadow)">
    <rect x="430" y="88" width="340" height="92" rx="18" fill="#ffffff" stroke="#b9d0ee" stroke-width="2"/>
    <text x="600" y="124" text-anchor="middle" class="label">ChatService</text>
    <text x="600" y="153" text-anchor="middle" class="sub">归并回复 · 更新状态 · 控制持久化顺序</text>
  </g>

  <path d="M600 180 L600 227" stroke="#5b8def" stroke-width="3" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="345" y="235" width="510" height="108" rx="20" fill="#e7f0ff" stroke="#78a7eb" stroke-width="2"/>
    <text x="600" y="273" text-anchor="middle" class="label">StorageBase</text>
    <text x="600" y="302" text-anchor="middle" class="sub">业务层持久化端口</text>
    <text x="600" y="327" text-anchor="middle" class="code">upsert_message · update_session_state</text>
  </g>

  <path d="M515 343 C515 385 310 374 310 425" fill="none" stroke="#5b8def" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M685 343 C685 385 890 374 890 425" fill="none" stroke="#5b8def" stroke-width="3" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="105" y="433" width="410" height="102" rx="19" fill="#ffffff" stroke="#b9d0ee" stroke-width="2"/>
    <text x="310" y="471" text-anchor="middle" class="label">RedisStorage</text>
    <text x="310" y="500" text-anchor="middle" class="sub">Session JSON · Message List · TTL</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="685" y="433" width="410" height="102" rx="19" fill="#ffffff" stroke="#b9d0ee" stroke-width="2"/>
    <text x="890" y="471" text-anchor="middle" class="label">AsyncSQLAlchemyStorage</text>
    <text x="890" y="500" text-anchor="middle" class="sub">SessionRow · MessageRow · 原子 upsert</text>
  </g>

  <path d="M310 535 L310 578" stroke="#8faac5" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M890 535 L890 578" stroke="#8faac5" stroke-width="2.5" marker-end="url(#arrow)"/>

  <g>
    <rect x="105" y="586" width="410" height="60" rx="15" fill="#dfeaf7"/>
    <text x="310" y="612" text-anchor="middle" class="small">尾部同 ID：替换当前消息</text>
    <text x="310" y="634" text-anchor="middle" class="small">否则：追加新消息</text>
  </g>

  <g>
    <rect x="685" y="586" width="410" height="60" rx="15" fill="#dfeaf7"/>
    <text x="890" y="612" text-anchor="middle" class="small">(session_id, msg_id) 复合主键</text>
    <text x="890" y="634" text-anchor="middle" class="small">冲突时更新 payload</text>
  </g>
</svg>
