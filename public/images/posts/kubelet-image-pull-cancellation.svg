<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">
  <rect width="1200" height="600" rx="20" fill="#f2f6fa"/>
  <defs>
    <marker id="a3" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#3a6491"/>
    </marker>
  </defs>

  <text x="600" y="46" text-anchor="middle" font-size="21" font-weight="700" fill="#24476b">取消信号停在 kubelet 内部</text>
  <text x="600" y="74" text-anchor="middle" font-size="14" fill="#6b87a3">日志打了「已取消」，但下发给容器运行时的 context 被剥离了取消能力</text>

  <!-- 调用方 -->
  <rect x="60" y="120" width="190" height="80" rx="12" fill="#5b88b0"/>
  <text x="155" y="152" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">调用方</text>
  <text x="155" y="176" text-anchor="middle" font-size="12.5" fill="#eef5fa">超时，删除 Pod</text>

  <path d="M250,160 L306,160" stroke="#3a6491" stroke-width="2" marker-end="url(#a3)"/>

  <!-- kubelet -->
  <rect x="312" y="105" width="560" height="200" rx="14" fill="#ffffff" stroke="#3a6491" stroke-width="2.5"/>
  <text x="592" y="134" text-anchor="middle" font-size="16" font-weight="700" fill="#3a6491">kubelet</text>

  <rect x="344" y="150" width="230" height="68" rx="10" fill="#eef5fa"/>
  <text x="459" y="178" text-anchor="middle" font-size="13.5" fill="#24476b">
    <tspan x="459">调谐循环收到取消</tspan>
    <tspan x="459" dy="19" font-family="monospace" font-size="11.5">Cancelling current pod sync</tspan>
  </text>

  <path d="M574,184 L612,184" stroke="#3a6491" stroke-width="2" marker-end="url(#a3)"/>

  <rect x="618" y="150" width="228" height="68" rx="10" fill="#b5544a"/>
  <text x="732" y="178" text-anchor="middle" font-size="13.5" fill="#ffffff">
    <tspan x="732">SyncPod 调运行时这一层</tspan>
    <tspan x="732" dy="19" font-family="monospace" font-size="11.5">context.WithoutCancel</tspan>
  </text>

  <text x="592" y="250" text-anchor="middle" font-size="13" font-weight="700" fill="#b5544a">取消能力到这里被剥离，再往下传的 context 已经不可取消</text>
  <text x="592" y="276" text-anchor="middle" font-size="12.5" fill="#6b87a3">日志是真的，它只描述调谐循环自己，不代表下游真的停了</text>

  <path d="M872,205 L928,205" stroke="#b5544a" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#a3)"/>

  <!-- containerd -->
  <rect x="934" y="150" width="206" height="110" rx="12" fill="#24476b"/>
  <text x="1037" y="182" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">containerd</text>
  <text x="1037" y="208" text-anchor="middle" font-size="12.5" fill="#a9c4dc">
    <tspan x="1037">PullImage 继续跑</tspan>
    <tspan x="1037" dy="19">带宽一直被占着</tspan>
  </text>

  <!-- 对照实验 -->
  <rect x="60" y="340" width="520" height="190" rx="14" fill="#ffffff" stroke="#b5544a" stroke-width="2"/>
  <text x="320" y="370" text-anchor="middle" font-size="15.5" font-weight="700" fill="#b5544a">删 Pod 之后（经 kubelet）</text>
  <text x="320" y="406" text-anchor="middle" font-size="30" font-weight="700" fill="#b5544a">323 秒</text>
  <text x="320" y="432" text-anchor="middle" font-size="13" fill="#8c4a42">拉取继续跑，多下 7.3 GB</text>
  <rect x="100" y="448" width="440" height="58" rx="10" fill="#f6ebe9"/>
  <text x="320" y="473" text-anchor="middle" font-size="12.5" fill="#8c4a42">
    <tspan x="320">后果：新建的小镜像 Pod 要等 404 秒才能跑第一条命令</tspan>
    <tspan x="320" dy="19">同样的 Pod 在空闲节点上只要 19.8 秒</tspan>
  </text>

  <rect x="620" y="340" width="520" height="190" rx="14" fill="#ffffff" stroke="#24476b" stroke-width="2"/>
  <text x="880" y="370" text-anchor="middle" font-size="15.5" font-weight="700" fill="#24476b">绕过 kubelet，直接调 containerd</text>
  <text x="880" y="406" text-anchor="middle" font-size="30" font-weight="700" fill="#24476b">1–2 秒</text>
  <text x="880" y="432" text-anchor="middle" font-size="13" fill="#3a6491">取消后立刻停</text>
  <rect x="660" y="448" width="440" height="58" rx="10" fill="#eef5fa"/>
  <text x="880" y="473" text-anchor="middle" font-size="12.5" fill="#24476b">
    <tspan x="880">所以「先拉镜像再建 Pod」是必须的</tspan>
    <tspan x="880" dy="19">不是可选优化——取消权必须握在自己手里</tspan>
  </text>

  <text x="600" y="570" text-anchor="middle" font-size="13" fill="#6b87a3">排查方法：日志说取消了不等于真的取消了，要么读源码确认信号路径，要么把取消点换一层做对照</text>
</svg>
