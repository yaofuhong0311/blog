<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="612" viewBox="0 0 1200 612" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">
  <rect width="1200" height="612" rx="20" fill="#f2f6fa"/>
  <defs>
    <marker id="admwb" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#3a6491"/></marker>
    <marker id="admwr" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#b5544a"/></marker>
  </defs>

  <text x="600" y="44" text-anchor="middle" font-size="21" font-weight="700" fill="#24476b">限流器在拒绝它本该排的队</text>
  <text x="600" y="72" text-anchor="middle" font-size="14" fill="#6b87a3">容量满了该让请求等一会儿，而不是立刻把它打回去</text>

  <!-- 左：拒绝（现状） -->
  <rect x="40" y="102" width="548" height="378" rx="14" fill="#ffffff" stroke="#b5544a" stroke-width="2"/>
  <text x="62" y="130" font-size="15" font-weight="700" fill="#b5544a">拒绝（现状）</text>

  <rect x="62" y="150" width="146" height="58" rx="10" fill="#5b88b0"/>
  <text x="135" y="185" text-anchor="middle" font-size="13" fill="#ffffff">请求到达</text>

  <path d="M210,179 L237,179" stroke="#b5544a" stroke-width="2" marker-end="url(#admwr)"/>

  <rect x="241" y="150" width="146" height="58" rx="10" fill="#ffffff" stroke="#d8c2bf" stroke-width="1.6"/>
  <text x="314" y="185" text-anchor="middle" font-size="13" fill="#8c4a42">容量已满</text>

  <path d="M389,179 L416,179" stroke="#b5544a" stroke-width="2" marker-end="url(#admwr)"/>

  <rect x="420" y="150" width="146" height="58" rx="10" fill="#b5544a"/>
  <text x="493" y="185" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">立刻返回 <tspan font-family="monospace">503</tspan></text>

  <text x="314" y="268" text-anchor="middle" font-size="36" font-weight="700" fill="#b5544a">4.7 万次</text>
  <text x="314" y="294" text-anchor="middle" font-size="12" fill="#8c4a42">生产集群累计，全部是没排队就被拒</text>

  <rect x="62" y="312" width="504" height="72" rx="10" fill="#f6ebe9" stroke="#d8c2bf" stroke-width="1.4"/>
  <text x="314" y="340" text-anchor="middle" font-size="14" font-weight="700" fill="#8c4a42">其中 99.9% 在 2 秒内返回</text>
  <text x="314" y="364" text-anchor="middle" font-size="12" fill="#b5544a">说明根本没等，直接拒</text>

  <rect x="62" y="400" width="504" height="56" rx="10" fill="#b5544a"/>
  <text x="314" y="433" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">对训练任务这类调用方，立刻失败比等 30 秒糟糕得多</text>

  <!-- 右：等待（改后） -->
  <rect x="612" y="102" width="548" height="378" rx="14" fill="#ffffff" stroke="#24476b" stroke-width="2.5"/>
  <text x="634" y="130" font-size="15" font-weight="700" fill="#24476b">等待（改后）</text>

  <rect x="634" y="150" width="146" height="58" rx="10" fill="#5b88b0"/>
  <text x="707" y="185" text-anchor="middle" font-size="13" fill="#ffffff">请求到达</text>

  <path d="M782,179 L809,179" stroke="#3a6491" stroke-width="2" marker-end="url(#admwb)"/>

  <rect x="813" y="150" width="146" height="58" rx="10" fill="#ffffff" stroke="#5b88b0" stroke-width="1.6"/>
  <text x="886" y="185" text-anchor="middle" font-size="13" fill="#24476b">进队列</text>

  <path d="M961,179 L988,179" stroke="#3a6491" stroke-width="2" marker-end="url(#admwb)"/>

  <rect x="992" y="150" width="146" height="58" rx="10" fill="#24476b"/>
  <text x="1065" y="185" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">有位置就放行</text>

  <path d="M1065,230 L1065,212" stroke="#3a6491" stroke-width="2" marker-end="url(#admwb)"/>

  <rect x="813" y="232" width="325" height="62" rx="10" fill="#eef5fa" stroke="#c3d6e6" stroke-width="1.4"/>
  <text x="975" y="258" text-anchor="middle" font-size="12.5" fill="#24476b">
    <tspan x="975">看各机器的 Pod 名额和 CPU、内存</tspan>
    <tspan x="975" dy="19" fill="#6b87a3">都够了才放一个请求进去</tspan>
  </text>

  <rect x="634" y="312" width="504" height="72" rx="10" fill="#eef5fa" stroke="#c3d6e6" stroke-width="1.4"/>
  <text x="886" y="341" text-anchor="middle" font-size="14" font-weight="700" fill="#24476b">「这不是排队，是等待，等可以的时候就创建」</text>
  <text x="886" y="364" text-anchor="middle" font-size="12" fill="#6b87a3">——作者原话</text>

  <rect x="634" y="400" width="504" height="56" rx="10" fill="#24476b"/>
  <text x="886" y="433" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">必须配排队超时，否则队列无限堆积变成新问题</text>

  <!-- 底部结论 -->
  <rect x="40" y="500" width="1120" height="88" rx="12" fill="#24476b"/>
  <text x="600" y="532" text-anchor="middle" font-size="14.5" font-weight="700" fill="#ffffff">放行时要同时看 Pod 名额和 CPU、内存</text>
  <text x="600" y="558" text-anchor="middle" font-size="12.5" fill="#a9c4dc">现网出过名额被占满、约 13% 建沙箱请求超时</text>
</svg>
